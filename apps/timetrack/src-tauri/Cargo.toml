[package]
name = "timetrack"
version = "0.1.0"
description = "Reconstructs a day of Jira/Tempo worklogs from passive evidence"
edition = "2021"
publish = false

[lib]
name = "timetrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"] }

[dependencies]
base64 = "0.22.1"
chrono = "0.4.45"
# Not on crates.io - the Tauri team publishes it as a git repo, with no version tags to pin.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
notify = "8.2.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "form", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "sync", "time", "net", "rt-multi-thread", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["zbus-secret-service-keyring-store"] }
libc = "0.2.189"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = "5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["apple-native-keyring-store"] }
block2 = "0.6.2"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { version = "0.3.2", features = ["AXError", "AXUIElement", "libc"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEventSource", "CGEventTypes"] }
objc2-foundation = { version = "0.3.2", features = [
  "NSDistributedNotificationCenter",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSString",
  "block2",
] }
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["windows-native-keyring-store"] }
# Held at what Tauri pulls, so the lockfile keeps one copy. On 0.62 the blocking method on
# IAsyncOperation is join(), not get(), so auth.rs stops compiling as well.
windows = { version = "0.61.3", features = [
  "Security_Credentials_UI",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.2.1"
