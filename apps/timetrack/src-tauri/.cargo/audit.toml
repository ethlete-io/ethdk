[advisories]
# RUSTSEC-2024-0429: `glib::VariantStrIter` has unsound `Iterator` and `DoubleEndedIterator` impls.
# glib 0.18.5 reaches us only through the Tauri stack and has no fixed release. Drop this entry when
# a Tauri upgrade moves us past glib 0.18.
# RUSTSEC-2026-0367, -0368, -0369: zip extraction follows symlinks and keeps SUID bits. zip 4.6.1
# comes from tauri-plugin-updater 2.x, which pins zip ^4; the fix is in zip 9. The updater extracts
# only a bundle whose signature `download` already verified. Drop these when updater 3 is stable.
ignore = ["RUSTSEC-2024-0429", "RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"]

[output]
# Do not add "unmaintained": six crates under the Tauri stack carry it today, so the job would be red
# on day one. A vulnerability fails the run whatever this list says.
deny = ["unsound", "yanked"]
format = "terminal"
quiet = false
show_tree = false
