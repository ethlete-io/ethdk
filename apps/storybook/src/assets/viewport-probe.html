<!doctype html>
<!-- Mobile-viewport probe for the verify-on-apple-devices skill.
     Loads a story in an iframe and overlays live viewport metrics (HUD), so the
     classic mobile traps — soft keyboard open, browser bar shown/hidden,
     100vh vs dvh/svh — can be read straight off a device screenshot, without a
     WebDriver session (real touch input ends Safari automation sessions).
     Usage: http://<host>:4400/assets/viewport-probe.html?story=<story-id> -->
<html>
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 disables Safari's zoom-on-focus (inputs < 16px font) so the
         HUD stays readable; test focus-zoom behavior on the bare story URL instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>viewport probe</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #story {
        border: 0;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        right: 0;
        z-index: 2147483647;
        background: rgba(0, 0, 0, 0.82);
        color: #3f6;
        font: 13px/1.45 monospace;
        padding: 6px 8px;
        text-align: right;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <iframe id="story"></iframe>
    <div id="hud">…</div>
    <script>
      const story = new URLSearchParams(location.search).get('story');
      document.getElementById('story').src = story
        ? `/iframe.html?id=${encodeURIComponent(story)}&viewMode=story`
        : 'about:blank';

      const probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;top:0;width:0;pointer-events:none;visibility:hidden';
      document.body.appendChild(probe);
      const px = (v) => {
        probe.style.height = v;
        return Math.round(probe.getBoundingClientRect().height);
      };

      function render() {
        const vv = window.visualViewport;
        const kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : NaN;
        // Pin the HUD to the *visual* viewport — with the keyboard open, iOS pans
        // the layout viewport and plain position:fixed elements scroll out of view
        // (one of the traps this page exists to demonstrate).
        const hud = document.getElementById('hud');
        if (vv) hud.style.transform = `translate(${Math.round(vv.offsetLeft)}px, ${Math.round(vv.offsetTop)}px)`;
        probe.style.cssText += ';padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0';
        const cs = getComputedStyle(probe);
        document.getElementById('hud').textContent = [
          `inner   ${window.innerWidth}x${window.innerHeight}`,
          vv ? `visual  ${Math.round(vv.width)}x${Math.round(vv.height)} +${Math.round(vv.offsetTop)}` : 'visual  n/a',
          `vh/dvh  ${px('100vh')} / ${px('100dvh')}`,
          `svh/lvh ${px('100svh')} / ${px('100lvh')}`,
          `safe    t${parseInt(cs.paddingTop)} b${parseInt(cs.paddingBottom)}`,
          `kbd     ${kb > 100 ? `OPEN ~${kb}px` : 'closed'}`,
        ].join('\n');
      }

      render();
      visualViewport?.addEventListener('resize', render);
      visualViewport?.addEventListener('scroll', render);
      window.addEventListener('resize', render);
      setInterval(render, 1000);
    </script>
  </body>
</html>
