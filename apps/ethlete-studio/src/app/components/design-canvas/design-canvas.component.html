<div
  [class.et-design-canvas__world--smooth]="smooth()"
  [style.transform]="worldTransform()"
  [style.--et-design-canvas-label-scale]="labelScale()"
  (transitionend)="smooth.set(false)"
  class="et-design-canvas__world"
>
  @for (row of rows(); track row.name) {
    <span [style.top.px]="row.y" class="et-design-canvas__row">{{ row.name }}</span>
  }

  @for (placed of placedFrames(); track placed.frame.id) {
    <ethlete-canvas-frame
      [frame]="placed.frame"
      [width]="placed.width"
      [live]="placed.live"
      [active]="placed.active"
      [selected]="placed.selected"
      [captionBelow]="arrangement() === 'grid'"
      [style.left.px]="placed.x"
      [style.top.px]="placed.y"
      [style.width.px]="placed.width"
      [style.height.px]="placed.height"
      (click)="select(placed.frame.id, $event)"
      (dblclick)="activate(placed.frame.id)"
      (heightChange)="storeHeight(placed.frame.id, $event)"
      (widthChange)="storeWidth(placed.frame.id, $event)"
      (escapeKeydown)="leaveActiveFrame()"
    />
  }

  @if (activeFrame(); as active) {
    <div
      [style.left.px]="active.x"
      [style.top.px]="active.y"
      [style.width.px]="active.width"
      [style.height.px]="active.height"
      class="et-design-canvas__resize"
    >
      <et-resize-handles
        [edges]="['e', 's', 'se']"
        (resizeStarted)="startResize({ width: active.width, height: active.height })"
        (resizeMoved)="resize(active.frame.id, $event)"
      />
    </div>
  }
</div>

<div class="et-design-canvas__hud">
  <button
    (click)="zoomBy(1 / ZOOM_STEP)"
    et-button
    type="button"
    variant="transparent"
    color="surface"
    size="sm"
    aria-label="Zoom out"
  >
    −
  </button>
  <button
    (click)="zoomTo(1)"
    class="et-design-canvas__zoom"
    et-button
    type="button"
    variant="transparent"
    color="surface"
    size="sm"
    title="Zoom to 100 % (Shift+0)"
  >
    {{ zoomPercent() }} %
  </button>
  <button
    (click)="zoomBy(ZOOM_STEP)"
    et-button
    type="button"
    variant="transparent"
    color="surface"
    size="sm"
    aria-label="Zoom in"
  >
    +
  </button>
  <button
    (click)="fitAll()"
    et-button
    type="button"
    variant="transparent"
    color="surface"
    size="sm"
    title="Zoom to fit (Shift+1)"
  >
    Fit
  </button>
</div>
