<div
  [open]="open()"
  [attr.aria-busy]="busy() || null"
  [offset]="{ mainAxis: 16, crossAxis: 0 }"
  [arrowPadding]="8"
  (openChange)="open.set($event)"
  class="relative size-10"
  etMenu
  placement="right-start"
>
  <button
    [attr.aria-label]="LABELS.trigger"
    class="group size-10 p-0 [--et-button-border-radius:var(--radius-control-lg)] [--et-button-border-width:0]"
    etMenuTrigger
    et-button
    type="button"
    variant="transparent"
    color="surface"
    size="sm"
  >
    <svg
      class="[--accent:var(--et-surface-background)] [--on-accent:var(--et-surface-text)] group-hover:[--accent:color-mix(in_srgb,var(--et-surface-control-text-hover)_5%,var(--et-surface-background))] group-active:[--accent:color-mix(in_oklch,var(--et-surface-control-text-active)_10%,transparent)] group-aria-expanded:[--accent:color-mix(in_srgb,var(--et-surface-control-text-hover)_5%,var(--et-surface-background))]"
      etAutoSurface
      width="40"
      height="40"
      viewBox="0 0 32 32"
      aria-hidden="true"
    >
      <rect width="32" height="32" rx="8" fill="var(--accent)" />
      <g
        [class]="busy() ? 'motion-safe:animate-studio-bob' : ''"
        class="origin-center scale-[0.72] transform-view"
        color="var(--on-accent)"
      >
        @if (busy()) {
          <path
            fill="currentColor"
            d="M11.5 5.5H24.1C26 5.5 27 6.9 26.4 8.7L22.8 20.9C22.5 22 21.8 22.9 20.8 23.4L8 28L9 21.6L5.9 17.4C5.2 16.5 5.2 15.2 5.9 14.2L9.4 6.8C9.8 6 10.6 5.5 11.5 5.5Z"
          />
          <path
            class="origin-center transform-fill motion-safe:animate-studio-blink"
            fill="var(--accent)"
            d="M12.8 11.5C12 11.3 11.2 11.8 11 12.6L10.2 15.7C10 16.5 10.5 17.3 11.3 17.5C12.1 17.7 12.9 17.2 13.1 16.4L13.9 13.3C14.1 12.5 13.6 11.7 12.8 11.5Z"
          />
          <path
            class="origin-center transform-fill motion-safe:animate-studio-blink"
            fill="var(--accent)"
            d="M20.1 10.6C19.3 10.4 18.5 10.9 18.3 11.7L17.5 14.8C17.3 15.6 17.8 16.4 18.6 16.6C19.4 16.8 20.2 16.3 20.4 15.5L21.2 12.4C21.4 11.6 20.9 10.8 20.1 10.6Z"
          />
        } @else {
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M11.5 5.5H24.1C26 5.5 27 6.9 26.4 8.7L22.8 20.9C22.5 22 21.8 22.9 20.8 23.4L8 28L9 21.6L5.9 17.4C5.2 16.5 5.2 15.2 5.9 14.2L9.4 6.8C9.8 6 10.6 5.5 11.5 5.5Z M12.8 11.5C12 11.3 11.2 11.8 11 12.6L10.2 15.7C10 16.5 10.5 17.3 11.3 17.5C12.1 17.7 12.9 17.2 13.1 16.4L13.9 13.3C14.1 12.5 13.6 11.7 12.8 11.5Z M20.1 10.6C19.3 10.4 18.5 10.9 18.3 11.7L17.5 14.8C17.3 15.6 17.8 16.4 18.6 16.6C19.4 16.8 20.2 16.3 20.4 15.5L21.2 12.4C21.4 11.6 20.9 10.8 20.1 10.6Z"
          />
        }
      </g>
    </svg>
  </button>
  <ng-template etMenuSurface>
    <et-menu [attr.aria-label]="LABELS.panel" class="box-border w-62 text-ui-md [--et-menu-max-height:80vh]">
      <et-menu-group-label>{{ LABELS.project }}</et-menu-group-label>
      <et-menu-radio-group [value]="project()" (valueChange)="selectProject($event)">
        @for (entry of ownEntries(); track entry.id) {
          <et-menu-radio-item [value]="entry.id" [disabled]="busy() && entry.id !== project()" closeOnActivate>
            <span class="flex min-w-0 flex-col">
              <span class="truncate">{{ entry.name }}</span>
              @if (entry.hint) {
                <span class="truncate text-et-surface-text-muted text-ui-sm">{{ entry.hint }}</span>
              }
            </span>
          </et-menu-radio-item>
        }
      </et-menu-radio-group>
      @if (runEntries().length) {
        <div etMenu placement="right-start">
          <button
            [attr.aria-label]="LABELS.clientRuns"
            [attr.data-current]="runShown() || null"
            class="data-current:font-ui-strong"
            etMenuTrigger
            et-menu-item
            type="button"
          >
            {{ LABELS.clientRuns }}
          </button>
          <ng-template etMenuSurface>
            <et-menu
              [attr.aria-label]="LABELS.clientRuns"
              class="box-border w-62 text-ui-md [--et-menu-max-height:80vh]"
            >
              <et-menu-radio-group [value]="project()" (valueChange)="selectProject($event)">
                @for (entry of runEntries(); track entry.id) {
                  <et-menu-radio-item [value]="entry.id" [disabled]="busy() && entry.id !== project()" closeOnActivate>
                    <span class="flex min-w-0 flex-col">
                      <span class="truncate">{{ entry.name }}</span>
                      <span class="truncate text-et-surface-text-muted text-ui-sm">{{ entry.run }}</span>
                    </span>
                  </et-menu-radio-item>
                }
              </et-menu-radio-group>
            </et-menu>
          </ng-template>
        </div>
      }
      <et-menu-separator />
      <button [disabled]="busy()" (activate)="openProject.emit()" et-menu-item type="button">
        {{ LABELS.openProject }}
      </button>
      <button [disabled]="busy()" (activate)="scanProjects.emit()" et-menu-item type="button">
        {{ LABELS.scan }}
      </button>
      <div etMenu placement="right-start">
        <button etMenuTrigger et-menu-item type="button">{{ statusLabel() }}</button>
        <ng-template etMenuSurface>
          <et-menu [attr.aria-label]="LABELS.designServer" class="box-border w-62 text-ui-md">
            @for (item of items(); track item.row) {
              <button
                [disabled]="busy() && item.row !== 'reload'"
                (activate)="runRow(item.row)"
                et-menu-item
                type="button"
              >
                {{ item.label }}
              </button>
            }
          </et-menu>
        </ng-template>
      </div>
      <et-menu-separator />
      <button
        [disabled]="busy() || projects().length < 2"
        (activate)="dialogs.confirmRemove(projectName(), removeProject.emit.bind(removeProject))"
        et-menu-item
        type="button"
        variant="destructive"
      >
        {{ LABELS.removeProject }}
      </button>
      <et-menu-separator />
      <button (activate)="dialogs.shortcuts()" et-menu-item type="button">{{ LABELS.shortcuts }}</button>
      <button (activate)="openHelp.emit()" et-menu-item type="button">{{ LABELS.help }}</button>
      <button (activate)="dialogs.about()" et-menu-item type="button">{{ LABELS.about }}</button>
    </et-menu>
  </ng-template>
</div>
