<div
  [open]="open()"
  [offset]="{ mainAxis: 20, crossAxis: 0 }"
  (openChange)="open.set($event)"
  class="relative size-10"
  etMenu
  arrow="false"
  placement="right-start"
>
  <button
    class="group size-10 p-0 [&_path]:origin-center [&_path]:scale-[0.72] [&_path]:transform-view"
    etMenuTrigger
    et-button
    type="button"
    variant="transparent"
    color="surface"
    size="sm"
    aria-label="Studio-Menü"
  >
    <svg
      class="[--accent:var(--et-surface-background-solid)] [--on-accent:var(--et-surface-color-solid)] group-hover:[--accent:color-mix(in_srgb,var(--et-surface-interaction-hover-solid)_5%,var(--et-surface-background-solid))] group-active:[--accent:color-mix(in_oklch,var(--et-surface-interaction-active-solid)_10%,transparent)] group-aria-expanded:[--accent:color-mix(in_srgb,var(--et-surface-interaction-hover-solid)_5%,var(--et-surface-background-solid))]"
      etAutoSurface
      width="40"
      height="40"
      viewBox="0 0 32 32"
      aria-hidden="true"
    >
      <g color="var(--on-accent)">
        <rect width="32" height="32" rx="8" fill="var(--accent)" />
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M11.5 5.5H24.1C26 5.5 27 6.9 26.4 8.7L22.8 20.9C22.5 22 21.8 22.9 20.8 23.4L8 28L9 21.6L5.9 17.4C5.2 16.5 5.2 15.2 5.9 14.2L9.4 6.8C9.8 6 10.6 5.5 11.5 5.5ZM12.8 11.5C12 11.3 11.2 11.8 11 12.6L10.2 15.7C10 16.5 10.5 17.3 11.3 17.5C12.1 17.7 12.9 17.2 13.1 16.4L13.9 13.3C14.1 12.5 13.6 11.7 12.8 11.5ZM20.1 10.6C19.3 10.4 18.5 10.9 18.3 11.7L17.5 14.8C17.3 15.6 17.8 16.4 18.6 16.6C19.4 16.8 20.2 16.3 20.4 15.5L21.2 12.4C21.4 11.6 20.9 10.8 20.1 10.6Z"
        />
      </g>
    </svg>
  </button>
  <ng-template etMenuSurface>
    <et-menu
      class="box-border w-62 text-ui-md [--et-menu-item-font-size:var(--text-md)] [--et-menu-item-height:var(--control-md)]"
      aria-label="Studio"
    >
      <et-menu-group-label>Studio</et-menu-group-label>
      @for (item of items(); track item.action) {
        <button (click)="serverAction.emit(item.action)" et-menu-item type="button">{{ item.label }}</button>
      }
    </et-menu>
  </ng-template>
</div>
