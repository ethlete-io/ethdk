<div class="app-shell @container flex min-h-211 w-full flex-col @min-[768px]:min-h-225" data-et-part="elements/shell">
  <header class="flex h-14 items-center gap-10 px-5 @min-[768px]:h-17 @min-[768px]:px-16">
    <h1 class="m-0 text-[22px] font-bold tracking-tight @min-[768px]:text-[26px]">App A</h1>
    <nav
      class="hidden items-center gap-7 @min-[768px]:flex"
      data-et-control="shell-top-nav"
      data-can-animate="true"
      aria-label="Hauptnavigation"
    >
      <a
        class="app-shell-top-link relative py-2 after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 aria-[current=page]:after:content-[''] text-[15px] font-medium no-underline"
        data-et-force="hover"
        href="#"
        aria-current="page"
        >Startseite</a
      ><a
        class="app-shell-top-link relative py-2 after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 aria-[current=page]:after:content-[''] text-[15px] font-medium no-underline"
        href="#"
        >Filme</a
      ><a
        class="app-shell-top-link relative py-2 after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 aria-[current=page]:after:content-[''] text-[15px] font-medium no-underline"
        href="#"
        >Serien</a
      ><a
        class="app-shell-top-link relative py-2 after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 aria-[current=page]:after:content-[''] text-[15px] font-medium no-underline"
        href="#"
        >Meine Liste</a
      >
    </nav>
    <div class="ml-auto">
      <button
        data-et-control="shell-search"
        data-can-animate="true"
        data-et-ng
        et-icon-button
        variant="transparent"
        aria-label="Suchen"
      >
        <svg
          data-et-ng
          width="24"
          height="24"
          aria-hidden="true"
          etIcon=""
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle data-et-ng cx="11" cy="11" r="7" />
          <path data-et-ng d="m20 20-4-4" />
        </svg>
      </button>
    </div>
  </header>
  <main class="flex-1" aria-label="Seiteninhalt"></main>
  <nav
    class="app-shell-tab-bar flex px-2 pb-4 @min-[768px]:hidden"
    data-et-control="shell-tab-bar"
    data-can-animate="true"
    aria-label="Hauptnavigation"
  >
    <a
      class="app-shell-tab flex flex-1 flex-col items-center gap-1 py-2 text-[11px] font-medium no-underline"
      href="#"
      aria-current="page"
      ><svg
        width="24"
        height="24"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" />
      </svg>
      <span>Startseite</span></a
    ><a class="app-shell-tab flex flex-1 flex-col items-center gap-1 py-2 text-[11px] font-medium no-underline" href="#"
      ><svg
        width="24"
        height="24"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="16" rx="2" />

    ><a class="app-shell-tab flex flex-1 flex-col items-center gap-1 py-2 text-[11px] font-medium no-underline" href="#"

        width="24"
        height="24"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="7" width="18" height="13" rx="2" />
        <path d="m8 3 4 4 4-4" />
      </svg>
      <span>Serien</span></a
    ><a class="app-shell-tab flex flex-1 flex-col items-center gap-1 py-2 text-[11px] font-medium no-underline" href="#"
      ><svg
        width="24"
        height="24"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span>Meine Liste</span></a
    >
  </nav>
</div>
