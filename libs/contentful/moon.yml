$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'library'
language: 'typescript'
dependsOn:
  - 'components'
  - 'core'
  - 'query'

tasks:
  build:
    command: 'ng-packagr -p ng-package.json -c tsconfig.lib.moon.json'
    deps:
      - '^:build'
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
    outputs:
      - '/dist/libs/contentful'

  test:
    command: 'vitest run'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
