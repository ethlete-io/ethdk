<span class="et-progress-step-marker">
  <ng-content select="[etProgressStepMarker]">
    @if (visuals.icon(); as icon) {
      <i [etIcon]="icon"></i>
    } @else {
      <span class="et-progress-step-marker-number"></span>
    }
  </ng-content>
</span>

<span class="et-progress-step-text">
  <span class="et-progress-step-label"><ng-content /></span>

  @if (visuals.label(); as label) {
    <span class="et-visually-hidden et-progress-step-state">{{ label }}</span>
  }

  <ng-content select="[etProgressStepDescription]" />
  <ng-content select="[etProgressStepContent]" />
</span>
