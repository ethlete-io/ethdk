<span class="et-progress-step-marker">
  @if (markerIcon(); as icon) {
    <i [etIcon]="icon"></i>
  } @else {
    <span class="et-progress-step-marker-number"></span>
  }
</span>

<span class="et-progress-step-text">
  <span class="et-progress-step-label"><ng-content /></span>

  @if (stateLabel(); as label) {
    <span class="et-progress-step-state">{{ label }}</span>
  }

  <ng-content select="[etProgressStepDescription]" />
</span>
