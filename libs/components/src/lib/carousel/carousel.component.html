<!-- The track is a scrollable: snapping per slide, one slide per view by default. Its own buttons, dots
     and edge masks are off — they are decorative (`aria-hidden`, not tabbable), and a carousel's controls
     have to be operable, so this component renders labelled ones below instead. -->
<et-scrollable
  [itemSize]="itemSize()"
  [snapOrigin]="carousel.slideAlign()"
  [renderButtons]="false"
  [renderNavigation]="false"
  [renderMasks]="false"
  class="et-carousel-track"
  scrollMode="element"
  snap
>
  <!-- The wrapper is rendered here rather than left to the slide template, so slide semantics, the `N of M`
       label and the clone marking are guaranteed rather than something to remember. It is also the element
       the scrollable sizes and the transitions apply to — a known element with a known progress property is
       what makes the effects reliable. -->
  @for (view of slideViews(); track view.key) {
    <div [isClone]="view.isClone" [autoplayTime]="view.autoplayTime" etCarouselItem>
      <!-- The inner element is what lets an effect move a slide's *content* independently of the slide's
           own box — which is the whole of `wipe`: the content holds still while the box travels over it,
           so the edge between two slides sweeps instead of the picture being cropped and dragged along. -->
      <div class="et-carousel-slide-content">
        <ng-container *ngTemplateOutlet="slideTemplate(); context: view.context" />
      </div>
    </div>
  }
</et-scrollable>

@if (showControls() || showDots() || isAutoplayEnabled()) {
  <div class="et-carousel-controls">
    @if (showControls()) {
      <button class="et-carousel-control" et-icon-button etCarouselPrevious size="sm" variant="transparent">
        <i class="et-carousel-control-icon et-carousel-control-icon--previous" etIcon="et-chevron"></i>
      </button>
    }

    @if (showDots()) {
      <div class="et-carousel-dots">
        @for (dot of dots(); track dot.index) {
          <button
            [attr.aria-label]="dot.label"
            [attr.aria-current]="dot.isActive ? 'true' : null"
            [attr.data-active]="dot.isActive ? '' : null"
            [attr.data-counting]="dot.isActive && isAutoplayRunning() ? '' : null"
            (click)="carousel.goTo(dot.index)"
            class="et-carousel-dot"
            etFocusRing
            type="button"
          >
            <!-- Rendered for every dot while autoplay is on, rather than only for the one counting down, so
                 it has somewhere to fade in from and out to. The countdown keyframes are applied by
                 `data-counting` instead, which starts them fresh every time the attribute lands — the same
                 restart the timer does, so the ring and the timer still cannot drift apart.

                 The two inner spans are the countdown itself: a half-disc sweeping each half of the circle,
                 which is what lets the ring close by `rotate` alone. See the CSS. -->
            @if (isAutoplayEnabled()) {
              <span
                [style.--_et-carousel-autoplay-duration.ms]="autoplayDuration()"
                class="et-carousel-dot-progress"
                aria-hidden="true"
              >
                <span class="et-carousel-dot-progress-half"></span>
                <span class="et-carousel-dot-progress-half"></span>
              </span>
            }
          </button>
        }
      </div>
    }

    @if (isAutoplayEnabled()) {
      <button
        [attr.data-playing]="isAutoplayRunning() ? '' : null"
        class="et-carousel-control et-carousel-play-toggle"
        et-icon-button
        etCarouselPlayToggle
        size="sm"
        variant="transparent"
      >
        <!-- Both icons, always: swapping the `etIcon` name would replace one element with another, and there
             is nothing to animate between two different elements. Stacked and cross-faded instead.
             Direct children on purpose — the icon button projects `[etIcon]`, so a wrapper of our own would
             not be projected at all and both icons would simply vanish. -->
        <i class="et-carousel-control-icon et-carousel-play-toggle-icon" etIcon="et-play" aria-hidden="true"></i>
        <i class="et-carousel-control-icon et-carousel-play-toggle-icon" etIcon="et-pause" aria-hidden="true"></i>
      </button>
    }

    @if (showControls()) {
      <button class="et-carousel-control" et-icon-button etCarouselNext size="sm" variant="transparent">
        <i class="et-carousel-control-icon et-carousel-control-icon--next" etIcon="et-chevron"></i>
      </button>
    }
  </div>
}
