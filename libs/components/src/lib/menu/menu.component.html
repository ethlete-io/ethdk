<div class="et-menu-header">
  <div class="et-menu-search-field">
    <ng-content select="input[etMenuSearch]" />

    @if (searchLoading()) {
      <et-spinner class="et-menu-search-spinner" diameter="16" />
    }
  </div>

  @if (searchError(); as error) {
    <p [id]="searchErrorId" class="et-menu-search-error" role="alert">{{ error }}</p>
  }
</div>

<div class="et-menu-body">
  <ng-content />
</div>
