<div #menuHeader class="et-menu-header">
  <div class="et-menu-search-field">
    <ng-content select="input[etMenuSearch]" />

    @if (showSearchSpinner()) {
      <et-spinner class="et-menu-search-spinner" diameter="16" />
    }
  </div>

  @if (searchError(); as error) {
    <p [id]="searchErrorId" [etProvideColor]="errorColorTheme" class="et-menu-search-error" role="alert">
      {{ error }}
    </p>
  }
</div>

<div class="et-menu-body-wrapper">
  <div #menuBody class="et-menu-body">
    <div #menuBodyContent class="et-menu-body-content">
      <ng-content />
    </div>
  </div>

  <et-scrollbar [for]="menuBody" autoHide />
</div>
