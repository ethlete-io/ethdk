<ng-content select="et-label" />
<ng-content select=".et-segmented-button-group-label" />

<ng-template #buttons>
  <div class="et-segmented-button-group-buttons">
    <ng-content />
  </div>
</ng-template>

@if (isScrollOverflow()) {
  <et-scrollable
    class="et-segmented-button-group-scrollable"
    renderMasks="false"
    role="presentation"
    scrollMode="element"
    scrollOrigin="center"
    scrollableRole="presentation"
  >
    <ng-container *ngTemplateOutlet="buttons" />
  </et-scrollable>
} @else {
  <ng-container *ngTemplateOutlet="buttons" />
}

@if (support.shouldRenderSupport()) {
  <et-form-support><ng-content select="et-hint" /></et-form-support>
}
