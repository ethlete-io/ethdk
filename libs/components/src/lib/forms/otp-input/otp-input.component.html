<ng-content />

<div class="et-otp-input-field">
  <div class="et-otp-input-segments" aria-hidden="true">
    @for (index of segmentIndexes(); track index) {
      <div
        [attr.data-caret]="(otp.focused() && otp.caretIndex() === index) || null"
        [attr.data-filled]="otp.segmentChars()[index] !== null || null"
        class="et-otp-input-segment"
      >
        @if (otp.segmentChars()[index]; as char) {
          <span class="et-otp-input-segment-char">{{ char }}</span>
        } @else if (otp.focused() && otp.caretIndex() === index) {
          <span class="et-otp-input-caret"></span>
        }
      </div>
    }
  </div>

  <!-- one real input stretched invisibly over the segments: reliable SMS autofill
       (autocomplete="one-time-code") and native paste for free -->
  <input
    #nativeInput
    [attr.aria-describedby]="otp.describedBy() || null"
    [attr.aria-invalid]="otp.shouldDisplayError() || null"
    [attr.aria-label]="otp.ariaLabel() || null"
    [attr.aria-labelledby]="otp.labelId() || null"
    [attr.inputmode]="otp.inputMode()"
    [attr.name]="otp.name() || null"
    [disabled]="otp.disabled()"
    [readOnly]="otp.readonly()"
    [required]="otp.required()"
    [value]="otp.value()"
    (blur)="otp.handleNativeBlur()"
    (focus)="otp.handleNativeFocus()"
    (input)="otp.handleNativeInput()"
    (keyup)="otp.handleNativeSelectionEvent()"
    (mouseup)="otp.handleNativeSelectionEvent()"
    class="et-otp-input-native"
    autocapitalize="off"
    autocomplete="one-time-code"
    spellcheck="false"
    type="text"
  />
</div>

@if (support.shouldRenderSupport()) {
  <et-form-support><ng-content select="et-hint" /></et-form-support>
}
