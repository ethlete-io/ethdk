<div class="et-rte-link-editor-header">
  <span class="et-rte-link-editor-title">{{ title() }}</span>
  <button
    [attr.aria-label]="labels().linkEditorClose"
    (click)="dismiss.emit()"
    et-icon-button
    size="sm"
    type="button"
    variant="transparent"
    mutedUntilPressed
  >
    <i etIcon="et-times"></i>
  </button>
</div>

<et-form-field size="sm">
  <et-label>{{ labels().linkTextLabel }}</et-label>
  <et-input
    [value]="textValue()"
    [placeholder]="labels().linkTextPlaceholder"
    (valueChange)="textValue.set($event)"
    (keydown.enter)="saveOnEnter($event)"
  />
</et-form-field>

<et-form-field size="sm">
  <et-label>{{ labels().linkUrlLabel }}</et-label>
  <et-input
    [value]="urlValue()"
    [placeholder]="labels().linkUrlPlaceholder"
    (valueChange)="urlValue.set($event)"
    (keydown.enter)="saveOnEnter($event)"
    type="url"
  />
</et-form-field>

<et-choice-field size="sm">
  <et-checkbox [checked]="newTabValue()" (checkedChange)="newTabValue.set($event)" />
  <et-label>{{ labels().linkNewTab }}</et-label>
</et-choice-field>

<div class="et-rte-link-editor-actions">
  @if (exists()) {
    <button (click)="removeLink.emit()" et-text-button size="sm" type="button">{{ labels().linkRemove }}</button>
  }
  <button [disabled]="!urlValue().trim()" (click)="save()" et-button size="sm" type="button">
    {{ exists() ? labels().linkUpdate : labels().linkAdd }}
  </button>
</div>
