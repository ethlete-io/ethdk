@for (tool of inlineTools(); track tool; let first = $first) {
  @if (tool === TOOLS.LINK && !first) {
    <span class="et-rte-toolbar-divider" aria-hidden="true"></span>
  }

  @if (TOOL_BUTTONS[tool]; as def) {
    <button
      [pressed]="def.isActive(editor())"
      [attr.aria-label]="def.label"
      (mousedown)="$event.preventDefault()"
      (click)="def.run(editor())"
      mutedUntilPressed
      et-icon-button
      size="sm"
      type="button"
      tabindex="-1"
    >
      <i [allowHardcodedColor]="def.allowHardcodedColor ?? false" [etIcon]="def.icon"></i>
    </button>
  }
}
