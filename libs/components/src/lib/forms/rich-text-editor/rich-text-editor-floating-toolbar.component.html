<button
  [pressed]="editor().boldActive()"
  (mousedown)="$event.preventDefault()"
  (click)="editor().toggleBold()"
  mutedUntilPressed
  et-icon-button
  size="xs"
  type="button"
  tabindex="-1"
  aria-label="Bold"
>
  <i etIcon="et-bold"></i>
</button>

<button
  [pressed]="editor().italicActive()"
  (mousedown)="$event.preventDefault()"
  (click)="editor().toggleItalic()"
  mutedUntilPressed
  et-icon-button
  size="xs"
  type="button"
  tabindex="-1"
  aria-label="Italic"
>
  <i etIcon="et-italic"></i>
</button>

<button
  [pressed]="editor().strikeActive()"
  (mousedown)="$event.preventDefault()"
  (click)="editor().toggleStrikethrough()"
  mutedUntilPressed
  et-icon-button
  size="xs"
  type="button"
  tabindex="-1"
  aria-label="Strikethrough"
>
  <i etIcon="et-strikethrough"></i>
</button>

<span class="et-rte-toolbar-divider" aria-hidden="true"></span>

<button
  [pressed]="editor().linkActive()"
  (mousedown)="$event.preventDefault()"
  (click)="editor().promptForLink()"
  mutedUntilPressed
  et-icon-button
  size="xs"
  type="button"
  tabindex="-1"
  aria-label="Link"
>
  <i [allowHardcodedColor]="true" etIcon="et-link"></i>
</button>
