@for (def of inlineTools(); track def.token; let first = $first) {
  @if (def.token === TOOLS.LINK && !first) {
    <span class="et-rte-toolbar-divider" aria-hidden="true"></span>
  }

  <!-- Icon tools only: this bar has no room for a custom control, and every inline tool is a toggle. -->
  @if (def.icon; as icon) {
    <button
      [pressed]="def.isActive?.(editor()) ?? false"
      [disabled]="def.isDisabled?.(editor()) ?? false"
      [attr.aria-label]="toolLabel(def)"
      (mousedown)="$event.preventDefault()"
      (click)="def.run?.(editor())"
      mutedUntilPressed
      et-icon-button
      size="sm"
      type="button"
      tabindex="-1"
    >
      <i [allowHardcodedColor]="def.allowHardcodedColor ?? false" [etIcon]="icon"></i>
    </button>
  }
}
