<div #alignMenu="etMenu" [autoFocus]="!hasTouchInput()" etMenu>
  <button
    [disabled]="disabled()"
    [pressed]="alignMenu.open()"
    [attr.aria-label]="labels().alignTrigger"
    (mousedown)="$event.preventDefault()"
    emitAriaPressed="false"
    etMenuTrigger
    et-icon-button
    size="sm"
    type="button"
    mutedUntilPressed
  >
    <i [etIcon]="currentIcon()"></i>
  </button>

  <ng-template etMenuSurface>
    <et-menu>
      <et-menu-radio-group [value]="current()" (valueChange)="select($event)" (mousedown)="$event.preventDefault()">
        @for (option of options(); track option.value) {
          <!-- eslint-disable-next-line ethlete/prefer-static-boolean-properties -- closeOnActivate is tri-state (boolean | undefined); a transform would collapse its unset state -->
          <et-menu-radio-item [value]="option.value" [closeOnActivate]="true" [icon]="option.icon">
            {{ option.label }}
          </et-menu-radio-item>
        }
      </et-menu-radio-group>
    </et-menu>
  </ng-template>
</div>
