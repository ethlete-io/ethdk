<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- ARIA toolbar pattern: the container only relays keys/focus for its roving tab stop; the buttons inside are the focusable controls -->
<div
  #toolbar
  [attr.aria-label]="labels().toolbar"
  (keydown)="handleToolbarKeydown($event)"
  (focusin)="handleToolbarFocusIn($event)"
  class="et-rte-toolbar"
  role="toolbar"
>
  @for (tool of dir.resolvedTools(); track $index) {
    @switch (tool) {
      @case (TOOLS.DIVIDER) {
        <span class="et-rte-toolbar-divider" aria-hidden="true"></span>
      }
      @case (TOOLS.HEADING) {
        <div #headingMenu="etMenu" [autoFocus]="!hasTouchInput()" etMenu>
          <button
            [disabled]="dir.disabled() || dir.readonly() || dir.headingToolDisabled()"
            [pressed]="headingMenu.open()"
            [attr.aria-label]="labels().textStyle(currentHeadingLabel())"
            (mousedown)="$event.preventDefault()"
            emitAriaPressed="false"
            etMenuTrigger
            et-icon-button
            size="sm"
            type="button"
            mutedUntilPressed
          >
            <i [etIcon]="currentHeadingIcon()"></i>
          </button>

          <ng-template etMenuSurface>
            <et-menu>
              <et-menu-radio-group
                [value]="dir.headingLevel()"
                (valueChange)="selectHeading($event)"
                (mousedown)="$event.preventDefault()"
              >
                @for (option of headingOptions(); track option.level) {
                  <!-- eslint-disable-next-line ethlete/prefer-static-boolean-properties -- closeOnActivate is tri-state (boolean | undefined); a transform would collapse its unset state -->
                  <et-menu-radio-item [value]="option.level" [closeOnActivate]="true" [icon]="option.icon">
                    {{ option.label }}
                  </et-menu-radio-item>
                }
              </et-menu-radio-group>
            </et-menu>
          </ng-template>
        </div>
      }
      @default {
        @if (toolDefs().get(tool); as def) {
          @if (def.control; as control) {
            <ng-container [ngComponentOutlet]="control" [ngComponentOutletInputs]="{ editor: dir }" />
          } @else {
            <button
              [pressed]="def.isActive?.(dir) ?? false"
              [disabled]="dir.disabled() || dir.readonly() || (def.isDisabled?.(dir) ?? false)"
              [attr.aria-label]="toolLabel(def)"
              (mousedown)="$event.preventDefault()"
              (click)="def.run?.(dir)"
              mutedUntilPressed
              et-icon-button
              size="sm"
              type="button"
            >
              <i [allowHardcodedColor]="def.allowHardcodedColor ?? false" [etIcon]="def.icon ?? ''"></i>
            </button>
          }
        }
      }
    }
  }
</div>

<div
  #editable
  [attr.contenteditable]="dir.disabled() || dir.readonly() ? 'false' : 'true'"
  [attr.tabindex]="dir.disabled() ? -1 : 0"
  [attr.data-placeholder]="dir.placeholder() || null"
  [attr.aria-invalid]="dir.shouldDisplayError() || null"
  [attr.aria-describedby]="dir.describedBy() || null"
  [attr.aria-labelledby]="dir.labelId() || null"
  [attr.aria-disabled]="dir.disabled() || null"
  [attr.aria-readonly]="dir.readonly() || null"
  (input)="syncValueFromDom()"
  (beforeinput)="interceptFormattingCommand($event)"
  (keydown)="interceptEditorKeydown($event)"
  (paste)="interceptPaste($event)"
  (pointerdown)="dir.clearPendingMarks()"
  (focus)="dir.focused.set(true)"
  (blur)="dir.focused.set(false); dir.touched.set(true)"
  class="et-rte-content"
  role="textbox"
  aria-multiline="true"
></div>
