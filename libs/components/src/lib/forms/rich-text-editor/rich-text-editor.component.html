<div class="et-rte-toolbar-dock">
  <div class="et-rte-toolbar-viewport">
    <div #toolbarElement [attr.aria-label]="labels().toolbar" class="et-rte-toolbar" etToolbar>
      @for (tool of dir.resolvedTools(); track $index) {
        @switch (tool) {
          @case (TOOLS.DIVIDER) {
            <et-divider orientation="vertical" decorative />
          }
          @default {
            @if (dir.toolDefs.get(tool); as def) {
              @if (def.control; as control) {
                <ng-container [ngComponentOutlet]="control" [ngComponentOutletInputs]="{ editor: dir }" />
              } @else {
                <button
                  [pressed]="def.isActive?.(dir) ?? false"
                  [disabled]="dir.disabled() || dir.readonly() || (def.isDisabled?.(dir) ?? false)"
                  [attr.aria-label]="toolLabel(def)"
                  (mousedown)="$event.preventDefault()"
                  (click)="def.run?.(dir)"
                  color="surface"
                  pressedColor="inherit"
                  et-icon-button
                  size="sm"
                  type="button"
                >
                  <i [allowHardcodedColor]="def.allowHardcodedColor ?? false" [etIcon]="def.icon ?? ''"></i>
                </button>
              }
            }
          }
        }
      }
    </div>

    <et-scrollbar [for]="toolbarElement" orientation="horizontal" autoHide />
  </div>
</div>

<div
  #editable
  [attr.contenteditable]="dir.disabled() || dir.readonly() ? 'false' : 'true'"
  [attr.tabindex]="dir.disabled() ? -1 : 0"
  [attr.data-placeholder]="dir.placeholder() || null"
  [attr.aria-required]="dir.required() || null"
  [attr.aria-invalid]="dir.shouldDisplayError() || null"
  [attr.aria-describedby]="dir.describedBy() || null"
  [attr.aria-label]="dir.ariaLabel() || null"
  [attr.aria-labelledby]="dir.labelId() || null"
  [attr.aria-disabled]="dir.disabled() || null"
  [attr.aria-readonly]="dir.readonly() || null"
  (input)="syncValueFromDom()"
  (beforeinput)="interceptFormattingCommand($event)"
  (keydown)="interceptEditorKeydown($event)"
  (paste)="interceptPaste($event)"
  (drop)="interceptDrop($event)"
  (click)="interceptClick($event)"
  (pointerdown)="dir.clearPendingMarks()"
  (focus)="dir.focused.set(true)"
  (blur)="dir.focused.set(false); dir.touched.set(true)"
  class="et-rte-content"
  role="textbox"
  aria-multiline="true"
></div>
