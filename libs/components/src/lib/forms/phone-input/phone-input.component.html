<!-- headless select composition: compact flag trigger, searchable country panel -->
<div
  [mirrorPanelWidth]="false"
  [value]="phone.country()"
  (valueChange)="handleCountryChange($event)"
  class="et-phone-input-country"
  etSelect
>
  <button
    [attr.aria-label]="countryLabel()"
    [disabled]="phone.disabled()"
    class="et-phone-input-country-trigger"
    etSelectTrigger
    type="button"
  >
    <span class="et-phone-input-country-flag" aria-hidden="true">
      @if (phone.registeredFlagTemplate(); as flagTemplate) {
        <ng-template [ngTemplateOutlet]="flagTemplate.templateRef" [ngTemplateOutletContext]="activeFlagContext()" />
      } @else {
        {{ activeFlag() }}
      }
    </span>
    <span class="et-phone-input-dial-code">+{{ phone.dialCode() }}</span>
  </button>

  <ng-template etSelectSurface let-select>
    <et-select-panel class="et-phone-input-country-panel">
      <div class="et-phone-input-country-search">
        <input etSelectSearch placeholder="Search countries" />
      </div>

      <!-- the label carries the dial code too, so searching by "+49" / "49" works -->
      @for (country of countries(); track country.iso2) {
        <et-select-option [label]="country.name + ' +' + country.dialCode" [value]="country.iso2">
          <span class="et-phone-input-option-flag" aria-hidden="true">
            @if (phone.registeredFlagTemplate(); as flagTemplate) {
              <ng-template
                [ngTemplateOutlet]="flagTemplate.templateRef"
                [ngTemplateOutletContext]="{ $implicit: country }"
              />
            } @else {
              {{ country.flag }}
            }
          </span>
          <span class="et-phone-input-option-name">{{ country.name }}</span>
          <span class="et-phone-input-option-dial">+{{ country.dialCode }}</span>
        </et-select-option>
      }

      @if (!select.visibleItems().length) {
        <div class="et-select-state et-select-state--empty">No countries found</div>
      }
    </et-select-panel>
  </ng-template>
</div>

<input class="et-phone-input-field" etPhoneInputField />

@if (showClear()) {
  <!-- pointer-only, out of the tab order — keyboard users clear by erasing the text.
       mousedown is prevented so the field keeps focus (its blur would unmount this
       button before the click could land) -->
  <button
    [attr.aria-label]="clearLabel()"
    (click)="handleClearClick($event)"
    (mousedown)="$event.preventDefault()"
    class="et-phone-input-clear"
    animate.enter="et-phone-input-clear--enter"
    animate.leave="et-phone-input-clear--leave"
    tabindex="-1"
    type="button"
  >
    <i etIcon="et-times"></i>
  </button>
}
