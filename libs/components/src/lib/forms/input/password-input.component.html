<input
  #nativeInput
  [type]="passwordDir.inputType()"
  [value]="passwordDir.displayValue()"
  [disabled]="passwordDir.disabled()"
  [readOnly]="passwordDir.readonly()"
  [required]="passwordDir.required()"
  [placeholder]="passwordDir.effectivePlaceholder()"
  [attr.autocomplete]="passwordDir.autocomplete() || null"
  [attr.name]="passwordDir.name() || null"
  [attr.aria-invalid]="passwordDir.shouldDisplayError() || null"
  [attr.aria-describedby]="passwordDir.describedBy() || null"
  [attr.aria-label]="passwordDir.ariaLabel() || null"
  [attr.aria-labelledby]="passwordDir.labelId() || null"
  (input)="syncNativeValue($event)"
  (keydown)="passwordDir.syncCapsLock($event)"
  (keyup)="passwordDir.syncCapsLock($event)"
  (mousedown)="passwordDir.syncCapsLock($event)"
  (focus)="passwordDir.focused.set(true)"
  (blur)="passwordDir.focused.set(false); passwordDir.touched.set(true)"
  class="et-password-input-native"
/>

@if (showCapsLockWarning()) {
  <span class="et-password-input-caps-warning" role="status">
    <i [etTooltip]="resolvedCapsLockLabel()" aria-hidden="true" etIcon="et-triangle-exclamation"></i>
    <span class="et-password-input-caps-warning-text">{{ resolvedCapsLockLabel() }}</span>
  </span>
}

<ng-template etControlSuffix>
  @if (revealable()) {
    <button
      [attr.aria-label]="passwordDir.revealed() ? resolvedHideLabel() : resolvedRevealLabel()"
      [attr.aria-pressed]="passwordDir.revealed()"
      [disabled]="passwordDir.disabled()"
      (click)="passwordDir.toggleRevealed(); $event.stopPropagation()"
      class="et-password-input-reveal"
      type="button"
    >
      <i [etIcon]="passwordDir.revealed() ? 'et-eye-slash' : 'et-eye'" aria-hidden="true"></i>
    </button>
  }
</ng-template>
