<input
  #nativeInput
  [value]="numberInputDir.displayValue()"
  [disabled]="numberInputDir.disabled()"
  [readOnly]="numberInputDir.readonly()"
  [required]="numberInputDir.required()"
  [placeholder]="numberInputDir.effectivePlaceholder()"
  [attr.autocomplete]="numberInputDir.autocomplete() || null"
  [attr.min]="numberInputDir.min() ?? null"
  [attr.max]="numberInputDir.max() ?? null"
  [attr.step]="numberInputDir.step() ?? null"
  [attr.name]="numberInputDir.name() || null"
  [attr.aria-invalid]="numberInputDir.shouldDisplayError() || null"
  [attr.aria-describedby]="numberInputDir.describedBy() || null"
  [attr.aria-label]="numberInputDir.ariaLabel() || null"
  [attr.aria-labelledby]="numberInputDir.labelId() || null"
  [attr.data-text-align]="numberInputDir.textAlign()"
  (input)="syncNativeValue($event)"
  (focus)="numberInputDir.focused.set(true)"
  (blur)="numberInputDir.focused.set(false); numberInputDir.touched.set(true)"
  class="et-number-input-native"
  type="number"
/>

@if (stepper()) {
  <div class="et-number-input-stepper">
    <button
      [attr.aria-label]="resolvedDecrementLabel()"
      [disabled]="!numberInputDir.canStepDown()"
      (pointerdown)="startStepRepeat($event, -1)"
      (pointerup)="stopStepRepeat()"
      (pointercancel)="stopStepRepeat()"
      (lostpointercapture)="stopStepRepeat()"
      class="et-number-input-stepper-button"
      type="button"
      tabindex="-1"
    >
      <i aria-hidden="true" etIcon="et-minus"></i>
    </button>
    <button
      [attr.aria-label]="resolvedIncrementLabel()"
      [disabled]="!numberInputDir.canStepUp()"
      (pointerdown)="startStepRepeat($event, 1)"
      (pointerup)="stopStepRepeat()"
      (pointercancel)="stopStepRepeat()"
      (lostpointercapture)="stopStepRepeat()"
      class="et-number-input-stepper-button"
      type="button"
      tabindex="-1"
    >
      <i aria-hidden="true" etIcon="et-plus"></i>
    </button>
  </div>
}
