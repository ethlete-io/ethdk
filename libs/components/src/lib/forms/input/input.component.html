<input
  #nativeInput
  [type]="inputDir.type()"
  [value]="inputDir.displayValue()"
  [disabled]="inputDir.disabled()"
  [readOnly]="inputDir.readonly()"
  [required]="inputDir.required()"
  [placeholder]="inputDir.effectivePlaceholder()"
  [attr.autocomplete]="inputDir.autocomplete() || null"
  [attr.name]="inputDir.name() || null"
  [attr.aria-invalid]="inputDir.shouldDisplayError() || null"
  [attr.aria-describedby]="inputDir.describedBy() || null"
  [attr.aria-label]="inputDir.ariaLabel() || null"
  [attr.aria-labelledby]="inputDir.labelId() || null"
  [attr.data-text-align]="inputDir.textAlign()"
  (focus)="inputDir.focused.set(true)"
  (blur)="inputDir.focused.set(false); inputDir.touched.set(true)"
  class="et-input-native"
/>

<ng-template etControlSuffix>
  @if (showClear()) {
    <button
      [attr.aria-label]="resolvedClearLabel()"
      (click)="handleClearClick($event)"
      (mousedown)="$event.preventDefault()"
      class="et-input-clear"
      animate.enter="et-input-clear--enter"
      animate.leave="et-input-clear--leave"
      tabindex="-1"
      type="button"
    >
      <i etIcon="et-times"></i>
    </button>
  }
</ng-template>
