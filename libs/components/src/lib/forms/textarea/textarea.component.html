<textarea
  #nativeTextarea
  [value]="textareaDir.displayValue()"
  [disabled]="textareaDir.disabled()"
  [readOnly]="textareaDir.readonly()"
  [required]="textareaDir.required()"
  [placeholder]="textareaDir.effectivePlaceholder()"
  [autocomplete]="textareaDir.autocomplete()"
  [rows]="textareaDir.rows()"
  [attr.name]="textareaDir.name() || null"
  [attr.aria-invalid]="textareaDir.shouldDisplayError() || null"
  [attr.aria-describedby]="textareaDir.describedBy() || null"
  [attr.aria-labelledby]="textareaDir.labelId() || null"
  [attr.data-resize]="textareaDir.effectiveResize()"
  (input)="syncNativeValue($event)"
  (focus)="textareaDir.focused.set(true)"
  (blur)="textareaDir.focused.set(false); textareaDir.touched.set(true)"
  class="et-textarea-native"
></textarea>
