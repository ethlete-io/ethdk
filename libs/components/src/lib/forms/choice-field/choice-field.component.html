<div
  [class.et-selection-card]="variant() === 'card'"
  class="et-choice-field-control"
  etColorInteractive
  etColorInteractiveContainer
>
  <div class="et-choice-field-control-slot et-selection-card-control">
    <ng-content />
  </div>

  <ng-content select="[etSelectionCardLeading]" />

  <div class="et-choice-field-label-area et-selection-card-content">
    <ng-content select="et-label" />
  </div>

  <ng-content select="[etSelectionCardTrailing]" />
</div>

@if (support.shouldRenderSupport()) {
  <div [style.block-size.px]="support.supportHeight()" class="et-choice-field-support" etColorInteractiveExclude>
    <div class="et-choice-field-support-stack">
      @if (support.shouldRenderError()) {
        <div
          #errorContent
          #errorAnimatable="etAnimatable"
          [id]="support.formFieldDir.errorId()"
          [attr.aria-atomic]="support.errorActive() ? 'true' : null"
          [attr.aria-hidden]="!support.errorActive() ? 'true' : null"
          [attr.aria-live]="support.errorActive() ? 'polite' : null"
          [attr.data-active]="support.errorActive() || null"
          [attr.data-direction]="support.errorDirection()"
          [attr.data-state]="support.errorState()"
          [etProvideColor]="support.errorColorTheme"
          class="et-choice-field-support-content et-choice-field-errors"
          etAnimatable
        >
          @for (error of support.visibleErrors(); track $index) {
            <et-form-error [error]="error" />
          }
        </div>
      }

      @if (support.shouldRenderWarning()) {
        <div
          #warningContent
          #warningAnimatable="etAnimatable"
          [id]="support.formFieldDir.warningId()"
          [attr.aria-atomic]="support.warningActive() ? 'true' : null"
          [attr.aria-hidden]="!support.warningActive() ? 'true' : null"
          [attr.aria-live]="support.warningActive() ? 'polite' : null"
          [attr.data-active]="support.warningActive() || null"
          [attr.data-direction]="support.warningDirection()"
          [attr.data-state]="support.warningState()"
          [etProvideColor]="support.warningColorTheme()"
          class="et-choice-field-support-content et-choice-field-warnings"
          etAnimatable
        >
          @for (warning of support.visibleWarnings(); track $index) {
            <et-form-warning [warning]="warning" />
          }
        </div>
      }

      @if (support.shouldRenderHint()) {
        <div
          #hintContent
          #hintAnimatable="etAnimatable"
          [id]="support.formFieldDir.hintId()"
          [attr.aria-hidden]="!support.hintActive() ? 'true' : null"
          [attr.data-active]="support.hintActive() || null"
          [attr.data-direction]="support.hintDirection()"
          [attr.data-state]="support.hintState()"
          class="et-choice-field-support-content et-choice-field-hint"
          etAnimatable
        >
          <ng-content select="et-hint" />
        </div>
      }
    </div>
  </div>
}
