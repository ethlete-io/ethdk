<div
  [class.et-selection-card]="variant() === 'card'"
  class="et-choice-field-control"
  etColorInteractive
  etColorInteractiveContainer
>
  <div class="et-choice-field-control-slot et-selection-card-control">
    <ng-content />
  </div>

  <ng-content select="[etSelectionCardLeading]" />

  <div class="et-choice-field-label-area et-selection-card-content">
    <ng-content select="et-label" />
  </div>

  <ng-content select="[etSelectionCardTrailing]" />
</div>

@if (support.shouldRenderSupport()) {
  <et-form-support etColorInteractiveExclude><ng-content select="et-hint" /></et-form-support>
}
