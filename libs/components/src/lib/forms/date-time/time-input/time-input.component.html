<input
  [etInputMask]="timeInput.maskPattern()"
  class="et-time-input-field"
  etTimeInputField
  maskValueMode="masked"
  placeholderChar="_"
/>

@if (showClear()) {
  <!-- pointer-only, out of the tab order — keyboard users clear by erasing the text.
       mousedown is prevented so the field keeps focus (its blur would unmount this
       button before the click could land) -->
  <button
    [attr.aria-label]="clearLabel()"
    (click)="handleClearClick($event)"
    (mousedown)="$event.preventDefault()"
    class="et-time-input-clear"
    tabindex="-1"
    type="button"
  >
    <i etIcon="et-times"></i>
  </button>
}

<button [attr.aria-label]="pickerTriggerLabel()" class="et-time-input-picker-trigger" etDatePickerTrigger>
  <i etIcon="et-clock"></i>
</button>

<ng-template etDatePickerSurface>
  <et-date-picker-panel dialogLabel="Choose a time">
    <et-time-picker
      [value]="timeInput.time()"
      [format]="timeInput.displayFormat()"
      [locale]="timeInput.effectiveLocale()"
      [minuteStep]="minuteStep()"
      [secondStep]="secondStep()"
      (valueChange)="timeInput.selectTime($event)"
    />
  </et-date-picker-panel>
</ng-template>
