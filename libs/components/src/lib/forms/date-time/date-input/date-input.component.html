<input
  [etInputMask]="dateInput.maskPattern()"
  class="et-date-input-field"
  etDateInputField
  maskValueMode="masked"
  placeholderChar="_"
/>

<ng-template etControlSuffix>
  @if (showClear()) {
    <!-- pointer-only, out of the tab order — keyboard users clear by erasing the text.
         mousedown is prevented so the field keeps focus (its blur would unmount this
         button before the click could land) -->
    <button
      [attr.aria-label]="resolvedClearLabel()"
      (click)="handleClearClick($event)"
      (mousedown)="$event.preventDefault()"
      class="et-input-clear"
      animate.enter="et-input-clear--enter"
      animate.leave="et-input-clear--leave"
      tabindex="-1"
      type="button"
    >
      <i etIcon="et-times"></i>
    </button>
  }

  <button [attr.aria-label]="resolvedPickerTriggerLabel()" class="et-input-picker-trigger" etDatePickerTrigger>
    <i etIcon="et-calendar"></i>
  </button>
</ng-template>

<ng-template etDatePickerSurface>
  <et-date-picker-panel dialogLabel="Choose a date">
    <et-calendar
      [value]="dateInput.date()"
      [min]="dateInput.minDate()"
      [max]="dateInput.maxDate()"
      [dateFilter]="dateInput.dateFilter()"
      [startAt]="dateInput.startAt()"
      [precision]="dateInput.precision()"
      [startView]="dateInput.startView()"
      [dateClass]="dateInput.dateClass()"
      [weekNumbers]="dateInput.weekNumbers()"
      [locale]="dateInput.effectiveLocale()"
      (valueChange)="dateInput.selectDate($event)"
    />
  </et-date-picker-panel>
</ng-template>
