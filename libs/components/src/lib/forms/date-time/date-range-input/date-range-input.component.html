<input
  [attr.aria-label]="resolvedStartAriaLabel()"
  [etInputMask]="rangeInput.maskPattern()"
  class="et-date-range-input-field"
  etDateRangeInputField
  maskValueMode="masked"
  placeholderChar="_"
  side="start"
/>

<span class="et-date-range-input-separator" aria-hidden="true">–</span>

<input
  [attr.aria-label]="resolvedEndAriaLabel()"
  [etInputMask]="rangeInput.maskPattern()"
  class="et-date-range-input-field"
  etDateRangeInputField
  maskValueMode="masked"
  placeholderChar="_"
  side="end"
/>

@if (showClear()) {
  <!-- pointer-only, out of the tab order — keyboard users clear by erasing the text.
       mousedown is prevented so the field keeps focus (its blur would unmount this
       button before the click could land) -->
  <button
    [attr.aria-label]="resolvedClearLabel()"
    (click)="handleClearClick($event)"
    (mousedown)="$event.preventDefault()"
    class="et-date-range-input-clear"
    animate.enter="et-date-range-input-clear--enter"
    animate.leave="et-date-range-input-clear--leave"
    tabindex="-1"
    type="button"
  >
    <i etIcon="et-times"></i>
  </button>
}

<button [attr.aria-label]="resolvedPickerTriggerLabel()" class="et-date-range-input-picker-trigger" etDatePickerTrigger>
  <i etIcon="et-calendar"></i>
</button>

<ng-template etDatePickerSurface>
  <et-date-picker-panel dialogLabel="Choose a date range">
    <et-calendar
      [rangeValue]="rangeInput.calendarRange()"
      [min]="rangeInput.minDate()"
      [max]="rangeInput.maxDate()"
      [dateFilter]="rangeInput.dateFilter()"
      [startAt]="rangeInput.startAt()"
      [precision]="rangeInput.precision()"
      [startView]="rangeInput.startView()"
      [dateClass]="rangeInput.dateClass()"
      [weekNumbers]="rangeInput.weekNumbers()"
      [comparisonStart]="rangeInput.comparisonStart()"
      [comparisonEnd]="rangeInput.comparisonEnd()"
      [locale]="rangeInput.effectiveLocale()"
      (rangeValueChange)="rangeInput.selectCalendarRange($event)"
      mode="range"
    />
  </et-date-picker-panel>
</ng-template>
