<input class="et-duration-input-field" etDurationInputField />

@if (showClear()) {
  <!-- mousedown is prevented so the field keeps focus: its blur would unmount this
       button before the click could land -->
  <button
    [attr.aria-label]="resolvedClearLabel()"
    (click)="handleClearClick($event)"
    (mousedown)="$event.preventDefault()"
    class="et-duration-input-clear"
    animate.enter="et-duration-input-clear--enter"
    animate.leave="et-duration-input-clear--leave"
    tabindex="-1"
    type="button"
  >
    <i etIcon="et-times"></i>
  </button>
}
