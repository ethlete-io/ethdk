<div [autoFocus]="!hasTouchInput()" etMenu>
  <button
    [disabled]="disabled()"
    [attr.aria-label]="triggerLabel()"
    [class.et-ml-rte-lang-trigger--flagged]="missingCount() > 0"
    (mousedown)="$event.preventDefault()"
    class="et-ml-rte-lang-trigger"
    etMenuTrigger
    type="button"
  >
    <span class="et-ml-rte-lang-trigger-code">{{ activeCode() }}</span>
  </button>

  <ng-template etMenuSurface>
    <et-menu>
      <et-menu-radio-group [value]="activeCode()" (valueChange)="select($event)" (mousedown)="$event.preventDefault()">
        @for (language of languages(); track language.code) {
          <et-menu-radio-item [value]="language.code" [icon]="activeIcon(language.code)" closeOnActivate>
            <span class="et-ml-rte-lang-item">
              <span class="et-ml-rte-lang-item-label">{{ language.label }}</span>
              <span
                [class.et-ml-rte-lang-dot--filled]="isFilled(language.code)"
                class="et-ml-rte-lang-dot"
                aria-hidden="true"
              ></span>
              <span class="et-visually-hidden et-ml-rte-lang-status">
                {{ isFilled(language.code) ? labels().languageFilled : labels().languageEmpty }}
              </span>
            </span>
          </et-menu-radio-item>
        }
      </et-menu-radio-group>
    </et-menu>
  </ng-template>
</div>
