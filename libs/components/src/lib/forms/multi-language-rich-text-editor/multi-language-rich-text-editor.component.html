@if (!dir.languagesError()) {
  <et-rich-text-editor
    [value]="dir.activeMarkdown()"
    [touched]="dir.touched()"
    [disabled]="dir.disabled()"
    [readonly]="dir.readonly()"
    [hidden]="dir.hidden()"
    [warnings]="dir.warnings()"
    [labels]="dir.labels()"
    [aria-label]="dir.ariaLabel()"
    [aria-labelledby]="dir.ariaLabelledby()"
    [invalid]="dir.invalid()"
    [errors]="dir.errors()"
    [required]="dir.required()"
    [placeholder]="placeholder()"
    [tools]="innerTools()"
    [autoformat]="autoformat()"
    (valueChange)="dir.writeActiveMarkdown($event)"
    (touchedChange)="dir.touched.set($event)"
  />
}
