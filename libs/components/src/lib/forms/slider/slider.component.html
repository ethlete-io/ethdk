<ng-content />

<div class="et-slider-interaction" etSliderTrack>
  <div class="et-slider-rail" aria-hidden="true"></div>
  <div [style.--_et-slider-fill-end]="slider.thumbPercents()[0] ?? 0" class="et-slider-fill" aria-hidden="true"></div>

  <div
    #thumb="etSliderThumb"
    [style.--_et-slider-thumb-position]="thumb.percent()"
    class="et-slider-thumb"
    etSliderThumb
  >
    @if (slider.registeredThumbLabelTemplate(); as labelTemplate) {
      <div class="et-slider-thumb-value" aria-hidden="true">
        <ng-template [ngTemplateOutlet]="labelTemplate.templateRef" [ngTemplateOutletContext]="thumbLabelContext(0)" />
      </div>
    }
  </div>
</div>

@if (support.shouldRenderSupport()) {
  <div [style.block-size.px]="support.supportHeight()" class="et-slider-support">
    <div class="et-slider-support-stack">
      @if (support.shouldRenderError()) {
        <div
          #errorContent
          #errorAnimatable="etAnimatable"
          [attr.aria-atomic]="support.errorActive() ? 'true' : null"
          [attr.aria-hidden]="!support.errorActive() ? 'true' : null"
          [attr.aria-live]="support.errorActive() ? 'polite' : null"
          [attr.data-active]="support.errorActive() || null"
          [etProvideColor]="support.errorColorTheme"
          class="et-slider-support-content et-slider-errors"
          etAnimatable
        >
          @for (error of support.visibleErrors(); track $index) {
            <et-form-error [error]="error" />
          }
        </div>
      }

      @if (support.shouldRenderHint()) {
        <div
          #hintContent
          #hintAnimatable="etAnimatable"
          [attr.aria-hidden]="!support.hintActive() ? 'true' : null"
          [attr.data-active]="support.hintActive() || null"
          class="et-slider-support-content et-slider-hint"
          etAnimatable
        >
          <ng-content select="et-hint" />
        </div>
      }
    </div>
  </div>
}
