<span [style.background-color]="colorInputDir.resolvedColor()" class="et-color-input-swatch" aria-hidden="true"></span>
<span class="et-color-input-value">{{ colorInputDir.value() ?? '' }}</span>
<input
  #nativeInput
  [value]="colorInputDir.resolvedColor()"
  [disabled]="colorInputDir.disabled()"
  [required]="colorInputDir.required()"
  [attr.name]="colorInputDir.name() || null"
  [attr.aria-invalid]="colorInputDir.shouldDisplayError() || null"
  [attr.aria-describedby]="colorInputDir.describedBy() || null"
  [attr.aria-labelledby]="colorInputDir.labelId() || null"
  [attr.aria-readonly]="colorInputDir.readonly() || null"
  (input)="syncNativeValue($event)"
  (mousedown)="blockWhenReadonly($event)"
  (click)="blockWhenReadonly($event)"
  (keydown)="blockWhenReadonly($event)"
  (focus)="colorInputDir.focused.set(true)"
  (blur)="colorInputDir.focused.set(false); colorInputDir.touched.set(true)"
  class="et-color-input-native"
  type="color"
/>
