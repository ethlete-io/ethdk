<button [attr.aria-label]="fallbackTriggerLabel()" class="et-color-input-trigger" etColorPickerTrigger>
  <span
    [style.--_et-color-input-swatch-color]="colorInputDir.swatchColor()"
    class="et-color-input-swatch"
    aria-hidden="true"
  ></span>
  <span class="et-color-input-value">{{ colorInputDir.displayValue() }}</span>
</button>

<ng-template etColorPickerSurface>
  <et-color-picker-panel />
</ng-template>
