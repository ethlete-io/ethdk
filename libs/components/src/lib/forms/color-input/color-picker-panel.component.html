<div #panelBody class="et-color-picker-panel-body">
  <div #area="etColorPickerArea" [attr.aria-label]="labels().area" etColorPickerArea role="group">
    <span
      [style.inset-inline-start.%]="area.saturationPercent()"
      [style.inset-block-end.%]="area.brightnessPercent()"
      [style.background-color]="opaqueHex()"
      class="et-color-picker-area-thumb"
      aria-hidden="true"
    ></span>

    <!-- two real sliders, one per axis: they carry the keyboard story the surface itself cannot,
         and the area's own drag handles the pointer (see etColorPickerChannel) -->
    <input [attr.aria-label]="labels().saturation" etColorPickerChannel="saturation" />
    <input [attr.aria-label]="labels().brightness" etColorPickerChannel="brightness" />
  </div>

  <div class="et-color-picker-track et-color-picker-track--hue">
    <span
      [style.inset-inline-start.%]="huePercent()"
      [style.background-color]="area.hueColor()"
      class="et-color-picker-track-thumb"
      aria-hidden="true"
    ></span>
    <input [attr.aria-label]="labels().hue" etColorPickerChannel="hue" />
  </div>

  @if (colorInput.alpha()) {
    <div
      [style.--_et-color-picker-alpha-color]="opaqueHex()"
      class="et-color-picker-track et-color-picker-track--alpha"
    >
      <span
        [style.inset-inline-start.%]="alphaPercent()"
        [style.background-color]="canonicalHex()"
        class="et-color-picker-track-thumb"
        aria-hidden="true"
      ></span>
      <input [attr.aria-label]="labels().alpha" etColorPickerChannel="alpha" />
    </div>
  }

  @if (colorInput.resolvedSwatches().length) {
    <div [attr.aria-label]="labels().swatches" class="et-color-picker-swatches" role="group">
      @for (swatch of colorInput.resolvedSwatches(); track swatch) {
        <button
          [style.background-color]="swatch"
          [attr.aria-label]="swatch"
          [attr.aria-pressed]="swatch === canonicalHex()"
          [disabled]="!colorInput.interactive()"
          (click)="colorInput.picker.commitColor(swatch)"
          class="et-color-picker-swatch"
          type="button"
        ></button>
      }
    </div>
  }

  <!-- one field carries the whole footer: the preview and the notation switch as prefixes, the
       eyedropper as a suffix - so every part sits on the field's own baseline and height, and the
       conversion advisory spans the row it belongs to -->
  <et-form-field class="et-color-picker-value" size="sm">
    <span
      [style.--_et-color-picker-preview-color]="canonicalHex()"
      class="et-color-picker-preview"
      etInputPrefix
      aria-hidden="true"
    ></span>

    @if (canSwitchNotation()) {
      <button
        [attr.aria-label]="labels().notation(notationLabel())"
        [disabled]="!colorInput.interactive()"
        (click)="switchNotation()"
        class="et-color-picker-notation"
        etInputPrefix
        type="button"
      >
        {{ notationLabel() }}
      </button>
    } @else {
      <span class="et-color-picker-notation" etInputPrefix aria-hidden="true">{{ notationLabel() }}</span>
    }

    <!-- committed on change, not on input: a half-typed color is unreadable, and rewriting the
         field to the displayed notation on every keystroke would fight the typing -->
    <et-input
      [value]="colorDraft()"
      [warnings]="notationWarning()"
      [disabled]="!colorInput.interactive()"
      [aria-label]="labels().value + ', ' + notationLabel()"
      (valueChange)="handleDraftInput($event)"
      (change)="commitColorDraft()"
      (keydown)="handleColorKeydown($event)"
      autocomplete="off"
    />

    @if (showEyeDropper) {
      <button
        [attr.aria-label]="labels().eyedropper"
        [disabled]="!colorInput.interactive()"
        (click)="openEyeDropper()"
        class="et-color-picker-eyedropper"
        etInputSuffix
        type="button"
      >
        <i etIcon="et-eyedropper"></i>
      </button>
    }
  </et-form-field>
</div>
