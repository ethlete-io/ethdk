@for (day of days(); track day.date.getTime()) {
  @if (day.nodes.length > 0) {
    <div class="et-scheduler-agenda-view-day">
      <div [attr.data-today]="day.today ? '' : null" class="et-scheduler-agenda-view-day-header">
        <span class="et-scheduler-agenda-view-day-weekday">{{ weekdayLabel(day.date) }}</span>
        <span class="et-scheduler-agenda-view-day-date">{{ day.date.getDate() }}</span>
      </div>

      <div class="et-scheduler-agenda-view-day-appointments">
        @for (row of day.rows; track row.node.appointment.id) {
          <div class="et-scheduler-agenda-view-appointment">
            @for (guide of row.guides; track $index) {
              <span [attr.data-guide]="guide" class="et-scheduler-agenda-view-guide" aria-hidden="true"></span>
            }

            <button
              #appointmentButton
              [attr.data-selected]="isSelected(row.node.appointment) ? '' : null"
              [attr.data-nested]="row.node.depth > 0 ? '' : null"
              [etProvideColor]="row.node.appointment.colorToken ?? null"
              (click)="select(row.node.appointment, appointmentButton)"
              class="et-scheduler-appointment"
              type="button"
            >
              @for (adornment of badgeAdornments(); track $index) {
                <ng-container
                  *ngComponentOutlet="adornment.component; inputs: { node: row.node }; injector: adornment.injector"
                />
              }
            </button>
          </div>
        }
      </div>
    </div>
  }
}
