@for (day of agenda.days(); track day.date.getTime()) {
  @if (day.nodes.length > 0) {
    <div class="et-scheduler-agenda-view-day">
      <div [attr.data-today]="day.today ? '' : null" class="et-scheduler-agenda-view-day-header">
        <span class="et-scheduler-agenda-view-day-weekday">{{ weekdayLabel(day.date) }}</span>
        <span class="et-scheduler-agenda-view-day-date">{{ day.date.getDate() }}</span>
      </div>

      <div class="et-scheduler-agenda-view-day-appointments">
        @for (node of day.nodes; track node.appointment.id) {
          <div [style.--_et-scheduler-agenda-view-depth]="node.depth" class="et-scheduler-agenda-view-appointment">
            <button
              #appointmentButton
              [attr.data-selected]="isSelected(node.appointment) ? '' : null"
              [attr.data-nested]="node.depth > 0 ? '' : null"
              [etProvideColor]="node.appointment.colorToken ?? null"
              (click)="select(node.appointment, appointmentButton)"
              class="et-scheduler-appointment"
              type="button"
            >
              @for (adornment of badgeAdornments(); track $index) {
                <ng-container
                  *ngComponentOutlet="adornment.component; inputs: { node }; injector: adornment.injector"
                />
              }
            </button>
          </div>
        }
      </div>
    </div>
  }
}
