<div class="et-scheduler-header">
  <button
    (click)="headless.goToToday()"
    class="et-scheduler-today-button"
    et-button
    size="sm"
    variant="outline"
    type="button"
  >
    {{ todayLabel() }}
  </button>

  <div class="et-scheduler-nav-buttons">
    <button
      [attr.aria-label]="previousLabel()"
      (click)="headless.previous()"
      class="et-scheduler-nav-button et-scheduler-nav-button--previous"
      et-icon-button
      size="sm"
      type="button"
    >
      <i etIcon="et-chevron"></i>
    </button>

    <button
      [attr.aria-label]="nextLabel()"
      (click)="headless.next()"
      class="et-scheduler-nav-button et-scheduler-nav-button--next"
      et-icon-button
      size="sm"
      type="button"
    >
      <i etIcon="et-chevron"></i>
    </button>
  </div>

  <span class="et-scheduler-header-label">{{ headerLabel() }}</span>

  <div class="et-scheduler-header-spacer"></div>

  <et-segmented-button-group [value]="headless.view()" (valueChange)="setView($event)" size="sm" variant="tabs">
    <et-label class="et-scheduler-view-switch-label">{{ switchViewLabel() }}</et-label>

    <et-segmented-button value="month">{{ monthViewLabel() }}</et-segmented-button>
    <et-segmented-button value="week">{{ weekViewLabel() }}</et-segmented-button>
    <et-segmented-button value="day">{{ dayViewLabel() }}</et-segmented-button>
  </et-segmented-button-group>
</div>

<div class="et-scheduler-body">
  @switch (headless.view()) {
    @case ('week') {
      <et-scheduler-time-grid-view />
    }
    @case ('day') {
      <et-scheduler-time-grid-view />
    }
    @default {
      <et-scheduler-month-view />
    }
  }
</div>
