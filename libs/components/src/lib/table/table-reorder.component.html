@if (dragging(); as drag) {
  <!-- Floating copy of the dragged header; the table's own markup stays put until drop. -->
  @if (pointer(); as position) {
    <div [style.left.px]="position.x" [style.top.px]="position.y" class="et-table-drag-ghost" aria-hidden="true">
      {{ drag.header }}
    </div>
  }

  <!-- Where the column will land, shown only while hovering another column. -->
  @if (indicatorX() !== null && bounds(); as span) {
    <div
      [style.left.px]="indicatorX()"
      [style.top.px]="span.top"
      [style.height.px]="span.height"
      class="et-table-drop-indicator"
      aria-hidden="true"
    ></div>
  }
}
