<!-- Rendered by the table once per visible header cell (see registerHeaderAdornment). Its own
     etDragHandle swallows the pointerdown, so grabbing the grip resizes instead of starting a header
     reorder when both features are used together. -->
<ng-template #resizeAdornment let-column>
  <span
    (dragStarted)="start(column)"
    (dragMoved)="update($event)"
    (dragEnded)="end()"
    (dblclick)="reset(column)"
    class="et-table-resize-grip"
    etDragHandle
    aria-hidden="true"
  ></span>
</ng-template>
