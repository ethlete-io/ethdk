<section class="sdk-table">
  <h2 class="sdk-title">Text on the light background</h2>
  <div class="sdk-pairs">
    <div class="sdk-pair-row">
      <span class="sdk-pair" style="background: rgb(var(--et-surface-background)); color: rgb(var(--et-surface-color))"
        >Aa</span
      >
      <span class="sdk-pair-label">text</span>
      <code class="sdk-value">--et-surface-color / --et-surface-background</code>
      <strong
        class="sdk-ratio"
        data-et-contrast="--et-surface-color --et-surface-background"
        data-et-contrast-needs="4.5"
        data-et-contrast-theme="et-surface--light"
        data-et-contrast-ratio="17.9"
        >17.9:1 AA</strong
      >
    </div>
    <div class="sdk-pair-row">
      <span
        class="sdk-pair"
        style="background: rgb(var(--et-surface-background)); color: rgb(var(--et-surface-color-muted))"
        >Aa</span
      >
      <span class="sdk-pair-label">muted</span>
      <code class="sdk-value">--et-surface-color-muted / --et-surface-background</code>
      <strong
        class="sdk-ratio"
        data-et-contrast="--et-surface-color-muted --et-surface-background"
        data-et-contrast-needs="4.5"
        data-et-contrast-theme="et-surface--light"
        data-et-contrast-ratio="1.8"
        data-et-contrast-low=""
        >1.8:1 below AA</strong
      >
    </div>
    <div class="sdk-pair-row">
      <span
        class="sdk-pair"
        style="background: rgb(var(--et-surface-background)); color: rgb(var(--et-surface-color-subtle))"
        >Aa</span
      >
      <span class="sdk-pair-label sdk-fixed">subtle</span>
      <code class="sdk-value">--et-surface-color-subtle / --et-surface-background</code>
      <strong
        class="sdk-ratio"
        data-et-contrast="--et-surface-color-subtle --et-surface-background"
        data-et-contrast-needs="4.5"
        data-et-contrast-theme="et-surface--light"
        data-et-contrast-ratio="4.9"
        >4.9:1 AA</strong
      >
    </div>
  </div>
</section>
