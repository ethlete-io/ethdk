<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--head-->
    <style>
      html,
      body {
        margin: 0;
      }

      html {
        scrollbar-width: none;
      }

      /* Vite's error overlay is fixed to the viewport; in flow, the reported frame height grows to show all of it. */
      vite-error-overlay {
        position: static;
        display: block;
        width: auto;
        height: auto;
      }

      vite-error-overlay::part(backdrop) {
        position: static;
        width: auto;
        height: auto;
        overflow: visible;
      }

      vite-error-overlay::part(window) {
        max-width: none;
        margin: 0;
        padding: 16px;
        border-radius: 0;
      }

      vite-error-overlay::part(message),
      vite-error-overlay::part(file),
      vite-error-overlay::part(stack) {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frame.ts"></script>
  </body>
</html>
