$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'tool'
language: 'typescript'
tags:
  - 'scope-tooling'

tasks:
  build:
    command: 'node tools/scripts/build-eslint-plugin.js'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '@globs(sources)'
      - '@globs(configs)'
      - '/tools/scripts/build-eslint-plugin.js'
    outputs:
      - '/dist/libs/eslint-plugin'

  test:
    command: 'vitest run'
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
