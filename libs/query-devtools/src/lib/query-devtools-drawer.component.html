@if (sel(); as selected) {
  <div
    (pointerdown)="host.startPaneResize($event, { pane: 'drawer', container: container() })"
    (dblclick)="host.resetPaneSize('drawer')"
    class="et-query-devtools-pane-resize"
    title="Drag to resize, double-click to reset"
    aria-hidden="true"
  ></div>

  <aside class="et-query-devtools-drawer">
    <div class="et-query-devtools-drawer-head">
      <span>Query detail</span>
      <button
        (click)="dismiss.emit()"
        class="et-query-devtools-btn et-query-devtools-icon-btn"
        type="button"
        title="Close detail"
      >
        ✕
      </button>
    </div>
    <et-query-devtools-detail [sel]="selected" />
  </aside>
}
