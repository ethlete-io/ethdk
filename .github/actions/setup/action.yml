name: Setup
description: Install Node and the workspace dependencies, and restore the Nx cache. The caller must check out first.

inputs:
  nx-cache-key:
    description: >-
      Job-scoped name for the Nx cache entry. Every job keeps its own entry, so two jobs cannot
      overwrite each other. Leave it empty in a job that runs no cacheable Nx target.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24.11.0'
        cache: 'yarn'

    - name: Derive appropriate SHAs for base and head for `nx affected` commands
      uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

    - run: yarn install --immutable
      shell: bash

    # Nx keeps every entry it ever wrote, so an entry that rolls forward for ever grows until saving
    # it costs more than the tasks it skips. The week number caps that: each job starts one cold run
    # a week and reuses the rest.
    - if: inputs.nx-cache-key != ''
      id: nx-cache-epoch
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    # Nx Cloud is off, so this is the only cache that survives a run. The key never hits exactly,
    # which is what makes it roll forward: the restore key loads the newest entry, and the run saves
    # a fresh one. The lockfile hash scopes it, because the cache holds an Nx-version-specific
    # database.
    - if: inputs.nx-cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ inputs.nx-cache-key }}-${{ hashFiles('yarn.lock') }}-${{ steps.nx-cache-epoch.outputs.week }}-${{ github.sha }}
        restore-keys: nx-${{ inputs.nx-cache-key }}-${{ hashFiles('yarn.lock') }}-${{ steps.nx-cache-epoch.outputs.week }}-
