name: CI (Next)

on:
  push:
    branches:
      - next
    paths-ignore:
      - 'plans/**'
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Publish without the CI job (hotfix only)'
        type: boolean
        default: false

concurrency: next_environment

jobs:
  ci:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    with:
      deploy: true
      storybook_target: storybook-next
      docs_target: docs-next
      channel_id: live
    secrets: inherit

  ci-apps:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci-apps.yml
    permissions:
      contents: read
    secrets: inherit

  publish:
    needs: ci
    if: ${{ always() && github.ref == 'refs/heads/next' && (needs.ci.result == 'success' || inputs.skip_ci) }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      version_command: 'yarn changeset:prerelease'
      commit_message: 'chore(repo): Update prereleases'
      title: 'Release prerelease packages'
      slack_title: '*New Next Release*'
    secrets: inherit

  release-apps:
    needs: [ci, ci-apps]
    if: ${{ always() && github.ref == 'refs/heads/next' && ((needs.ci.result == 'success' && needs.ci-apps.result == 'success') || inputs.skip_ci) }}
    uses: ./.github/workflows/release-apps.yml
    permissions:
      contents: write
    secrets: inherit
