name: CI (Next)

on:
  push:
    branches:
      - next
    paths-ignore:
      - 'plans/**'
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Publish without the CI job (hotfix only)'
        type: boolean
        default: false

concurrency: next_environment

jobs:
  groups:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci-groups.yml
    permissions:
      contents: read
    secrets: inherit

  repo:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci-repo.yml
    permissions:
      contents: read
    secrets: inherit

  ci:
    needs: groups
    if: ${{ !inputs.skip_ci && !cancelled() && needs.groups.outputs.sdk == 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    with:
      projects: ${{ needs.groups.outputs.sdk_projects }}
      deploy: true
      storybook_target: storybook-next
      docs_target: docs-next
      channel_id: live
    secrets: inherit

  ci-apps:
    needs: groups
    if: ${{ !inputs.skip_ci && !cancelled() && (needs.groups.outputs.studio == 'true' || needs.groups.outputs.timetrack == 'true') }}
    uses: ./.github/workflows/ci-apps.yml
    permissions:
      contents: read
    with:
      studio_projects: ${{ needs.groups.outputs.studio_projects }}
      timetrack_projects: ${{ needs.groups.outputs.timetrack_projects }}
      base: ${{ needs.groups.outputs.base }}
    secrets: inherit

  publish:
    needs: [groups, repo, ci]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/next' && (inputs.skip_ci || (needs.groups.result == 'success' &&
      needs.repo.result == 'success' &&
      (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.groups.outputs.sdk != 'true')))) }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      version_command: 'yarn changeset:prerelease'
      commit_message: 'chore(repo): Update prereleases'
      title: 'Release prerelease packages'
      slack_title: '*New Next Release*'
    secrets: inherit

  release-apps:
    needs: [groups, repo, ci-apps]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/next' && (inputs.skip_ci || (needs.groups.result == 'success' &&
      needs.repo.result == 'success')) }}
    uses: ./.github/workflows/release-apps.yml
    permissions:
      contents: write
    with:
      apps: >-
        ${{ inputs.skip_ci && 'timetrack-app,ethlete-studio' || format('{0},{1}',
        (needs.groups.outputs.timetrack == 'true' && needs.ci-apps.outputs.timetrack_ok == 'true') && 'timetrack-app' || '',
        (needs.groups.outputs.studio == 'true' && needs.ci-apps.outputs.studio_ok == 'true') && 'ethlete-studio' || '') }}
    secrets: inherit

  verified:
    name: All verified
    # The one check a branch rule can require: the groups ci-groups.yml skipped count as passed.
    if: always()
    needs: [groups, repo, ci, ci-apps]
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
