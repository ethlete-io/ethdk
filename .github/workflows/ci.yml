name: CI

# The SDK check suite, called by ci-pr, ci-next and ci-main; the private apps are checked by
# ci-apps.yml, so a red app never holds back the SDK publish. The jobs are independent on purpose:
# each one checks out and installs for itself, so they all start at the same time.
on:
  workflow_call:
    inputs:
      run_storybook:
        description: Build Storybook and run the component behavior tests.
        type: boolean
        default: true
      deploy:
        description: Deploy Storybook and the docs site after every other job passes.
        type: boolean
        default: false
      storybook_target:
        description: Firebase hosting target for Storybook. Empty means no Storybook deploy.
        type: string
        default: ''
      docs_target:
        description: Firebase hosting target for the docs site. Empty means no docs deploy.
        type: string
        default: ''
      channel_id:
        description: Firebase hosting channel. Use `live` for a release. Empty means a preview channel.
        type: string
        default: ''

# Nx Cloud is temporarily bypassed while the self-hosted instance is unstable. Remote caching
# is off; everything else about the run is unchanged. Delete this to re-enable.
env:
  NX_NO_CLOUD: 'true'
  APP_PROJECTS: ethlete-studio,timetrack-app,timetrack,timetrack-e2e,timetrack-vscode

jobs:
  checks:
    name: Checks
    # Every Linux job repeats this: a fork pull request must never reach the self-hosted runner while the repo is public.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # node:24.22.1-bookworm
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Publish is the first job to reach Verdaccio, at the end of the run; a refused token fails here first.
      - name: Verdaccio accepts the CI token
        if: vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          VERDACCIO_URL: ${{ vars.VERDACCIO_URL }}
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
        run: node ./tools/scripts/verdaccio-check.mjs

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: checks

      # Only the files this branch touched. The base commit was formatted when it landed.
      - run: yarn nx format:check ${NX_BASE:+--base=$NX_BASE --head=$NX_HEAD}

      # Fails when the generated agent files (AGENTS.md marker block, .agents/skills/ethlete-*)
      # drift from libs/agent-rules/content/**.
      - run: yarn agents:check

      # Fails when libs/*/src/lib/version.ts drifts from that lib's package.json version. Must run
      # before `build`, which regenerates those files as a target dependency and would hide the drift.
      - run: yarn versions:check

      # The install above runs the root `postinstall` (husky), so this fails when that stops generating .husky/_.
      - run: yarn hooks:check

      # Changeset notes are capped at one to two sentences / 40 words (see the `changeset` skill).
      # Only unreleased entries are checked - anything listed in .changeset/pre.json is locked.
      - run: yarn lint:changesets
      - run: node tools/scripts/check-migration-entries.mjs
      - run: yarn test:tools

      # Catches a commit made where the local commit-msg hook never ran (finding 390).
      # Only the commits of this push or pull request: NX_BASE lags to the last green run and reaches
      # into history that predates the commit rules.
      - run: |
          if [ -z "$EVENT_BASE" ] || [ "$EVENT_BASE" = "0000000000000000000000000000000000000000" ]; then
            EVENT_BASE="$NX_BASE"
          fi
          yarn commitlint --from "$EVENT_BASE" --to "$NX_HEAD"
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      # Every error code defined in components, core, bracket and contentful needs a row on its docs page.
      - run: yarn docs:error-codes:check

      # Fails when the sdk design tokens drift from the Storybook themes they are generated from.
      - run: yarn sdk:tokens:check

      # Every runtime export of @ethlete/query and @ethlete/core must be referenced by a scenario or
      # allowlisted with a reason in tools/export-coverage/<lib>.allowlist.json. Stale entries fail too.
      - run: yarn query:export-coverage
      - run: yarn core:export-coverage
      - run: yarn components:export-coverage
      - run: yarn vitest:projects:check

      - run: yarn lint:cli-related-map
      - run: yarn lint:commit-messages

      # Spec files are excluded from every lib's build tsconfig, so this is the only step that
      # type-checks them.
      - run: yarn nx run-many -t typecheck --exclude "$APP_PROJECTS"

      - run: yarn nx run-many -t lint --exclude "$APP_PROJECTS"

  test:
    name: Unit tests
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # playwright:v1.64.1-noble
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: test

      - run: bash tools/scripts/ci-apt-retry.sh yarn playwright install --with-deps chromium

      - name: Create a symlinked temp directory
        run: mkdir -p "$RUNNER_TEMP/real-tmp" && ln -s "$RUNNER_TEMP/real-tmp" "$RUNNER_TEMP/link-tmp"

      - name: Start the runner load measurement
        run: |
          echo "::notice title=unit-runner::nproc $(nproc), $(free -m | awk '/^Mem:/ {print "mem " $2 " MB, available " $7 " MB"}'), $(free -m | awk '/^Swap:/ {print "swap " $2 " MB"}')"
          nohup vmstat -n 5 > "$RUNNER_TEMP/vmstat.log" 2>&1 &

      # In a container job `${{ runner.temp }}` is the host path; $RUNNER_TEMP is the container path.
      - run: set -o pipefail; TMPDIR="$RUNNER_TEMP/link-tmp" yarn nx run-many -t test --exclude "storybook-e2e,$APP_PROJECTS" --output-style=static --parallel 1 -- --logHeapUsage --maxWorkers "$(nproc)" 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - run: yarn nx run storybook-e2e:test

      - name: Report the runner load
        if: always()
        run: node tools/scripts/ci-load-report.mjs "$RUNNER_TEMP/vmstat.log" "$RUNNER_TEMP/unit-tests.log"

      - name: Name the failing specs
        if: failure()
        run: |
          grep -E ' FAIL |Failed tasks|^ *- [a-z-]+:test|Error: |Timed out|ELIFECYCLE' "$RUNNER_TEMP/unit-tests.log" \
            | sed 's/%/%25/g; s/^/::error title=unit::/' | head -40 || true

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-log
          path: ${{ runner.temp }}/unit-tests.log
          retention-days: 7

      - run: yarn test:e2e-helpers

  query-clock-edges:
    name: Query scenarios at clock edge .${{ matrix.fraction }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # node:24.22.1-bookworm
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fraction: ['0', '999']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - run: npx vitest run src/scenarios
        working-directory: libs/query
        env:
          SCENARIO_CLOCK_FRACTION: ${{ matrix.fraction }}

  build:
    name: Build
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # node:24.22.1-bookworm
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: build

      - run: yarn nx run-many -t build --exclude "$APP_PROJECTS"

      - name: Lib build gate over the pushed range
        run: node tools/scripts/lib-build-gate.mjs "$NX_BASE" "$NX_HEAD"

      # Bundle-size goldens: fails when something in core/query/components becomes unshakeable again.
      # Accept a real change with `nx run treeshake:bundle-goldens:update` and commit goldens.json.
      - run: yarn nx run treeshake:bundle-goldens

      - if: inputs.docs_target != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-dist
          path: dist/apps/docs
          retention-days: 1

  storybook:
    name: Storybook
    if: inputs.run_storybook
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    outputs:
      e2e-folders: ${{ steps.e2e-selection.outputs.folders }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: storybook

      # `ALL`, nothing, or the behavior test folders the changes since the base can reach. A push's base
      # is the last commit whose behavior suite passed, so a skipped suite never shows green over a red
      # one. A release, and a push with no passed run to build on, run everything.
      - id: e2e-selection
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          IS_PUSH: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        run: |
          base=$PR_BASE
          if [ "$IS_PUSH" = true ]; then base=$(node apps/storybook-e2e/affected.mjs --passed-base); fi
          echo "Behavior test base: ${base:-none}"
          selection=$(node apps/storybook-e2e/affected.mjs "$base")
          if [ -n "$selection" ] && [ "$selection" != ALL ]; then
            selection=$(printf 'apps/storybook-e2e/src/%s/ ' $selection)
          fi
          echo "folders=$selection" >> "$GITHUB_OUTPUT"
          echo "Component behavior tests: ${selection:-none}"

      - run: yarn nx run storybook:build-storybook:ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-dist
          path: dist/storybook
          retention-days: 1

  storybook-test:
    name: Storybook story tests
    if: inputs.run_storybook
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # playwright:v1.64.1-noble
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: storybook-test

      - run: bash tools/scripts/ci-apt-retry.sh yarn playwright install --with-deps chromium

      # Renders every story in Chromium through Vitest, which builds the stories itself; a11y
      # violations are reported, not failed.
      - run: yarn nx run storybook:test-storybook

  storybook-e2e:
    name: Component behavior tests (${{ matrix.shard }}/3)
    if: inputs.run_storybook
    needs: storybook
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # playwright:v1.64.1-noble
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_FOLDERS: ${{ needs.storybook.outputs.e2e-folders }}
    steps:
      - if: env.E2E_FOLDERS != ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - if: env.E2E_FOLDERS != ''
        uses: ./.github/actions/setup

      - if: env.E2E_FOLDERS != ''
        run: bash tools/scripts/ci-apt-retry.sh yarn playwright install --with-deps chromium

      - if: env.E2E_FOLDERS != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-dist
          path: dist/storybook

      # Drives the downloaded build; `nx e2e storybook-e2e` would rebuild it. A small selection can
      # leave a shard without tests.
      - if: env.E2E_FOLDERS != ''
        run: |
          if [ "$E2E_FOLDERS" = ALL ]; then set --; else set -- $E2E_FOLDERS; fi
          yarn playwright test -c apps/storybook-e2e/playwright.config.ts --shard=${{ matrix.shard }}/3 --pass-with-no-tests "$@"

  csp-e2e:
    name: Strict CSP e2e
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # playwright:v1.64.1-noble
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: csp-e2e

      - run: bash tools/scripts/ci-apt-retry.sh yarn playwright install --with-deps chromium

      - run: yarn nx e2e csp-e2e

  docs-examples-e2e:
    name: Docs examples e2e
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # playwright:v1.64.1-noble
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: docs-examples-e2e

      - run: bash tools/scripts/ci-apt-retry.sh yarn playwright install --with-deps chromium

      - run: yarn nx e2e docs-examples-e2e

  cli-dist:
    name: CLI dist specs
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # playwright:v1.64.1-noble
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f' || '' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: cli-dist

      - run: bash tools/scripts/ci-apt-retry.sh yarn playwright install --with-deps chromium

      - run: yarn nx run-many -t build -p cli,components,core

      - run: yarn nx run cli:test-dist
        timeout-minutes: 5

  verified:
    name: Verified
    # A single check for a branch rule or a Mergify condition to name. Skipped jobs pass: a run
    # that leaves out Storybook on purpose is still a green run.
    if: always()
    needs:
      [
        checks,
        test,
        query-clock-edges,
        build,
        storybook,
        storybook-test,
        storybook-e2e,
        csp-e2e,
        docs-examples-e2e,
        cli-dist,
      ]
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # node:24.22.1-bookworm
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a' || '' }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy:
    name: Deploy
    if: ${{ !cancelled() && inputs.deploy && !contains(needs.*.result, 'failure') }}
    needs: [checks, test, build, storybook, storybook-test, storybook-e2e, csp-e2e, docs-examples-e2e, cli-dist]
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # node:24.22.1-bookworm
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a' || '' }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - if: inputs.storybook_target != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-dist
          path: dist/storybook

      - if: inputs.storybook_target != ''
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
          channelId: ${{ inputs.channel_id }}
          projectId: ethlete-sdk
          target: ${{ inputs.storybook_target }}
          firebaseToolsVersion: 15.34.0

      - if: inputs.docs_target != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: dist/apps/docs

      - if: inputs.docs_target != ''
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
          channelId: ${{ inputs.channel_id }}
          projectId: ethlete-sdk
          target: ${{ inputs.docs_target }}
          firebaseToolsVersion: 15.34.0
