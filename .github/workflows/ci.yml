name: CI

# The whole check suite, called by ci-pr, ci-next and ci-main. The jobs are independent on purpose:
# each one checks out and installs for itself, so they all start at the same time.
on:
  workflow_call:
    inputs:
      run_storybook:
        description: Build Storybook and run the component behavior tests.
        type: boolean
        default: true
      deploy:
        description: Deploy Storybook and the docs site after every other job passes.
        type: boolean
        default: false
      storybook_target:
        description: Firebase hosting target for Storybook. Empty means no Storybook deploy.
        type: string
        default: ''
      docs_target:
        description: Firebase hosting target for the docs site. Empty means no docs deploy.
        type: string
        default: ''
      channel_id:
        description: Firebase hosting channel. Use `live` for a release. Empty means a preview channel.
        type: string
        default: ''

# Nx Cloud is temporarily bypassed while the self-hosted instance is unstable. Remote caching
# is off; everything else about the run is unchanged. Delete this to re-enable.
env:
  NX_NO_CLOUD: 'true'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: checks

      # Only the files this branch touched. The base commit was formatted when it landed.
      - run: yarn nx format:check ${NX_BASE:+--base=$NX_BASE --head=$NX_HEAD}

      # Fails when the generated agent files (AGENTS.md marker block, .agents/skills/ethlete-*)
      # drift from libs/agent-rules/content/**.
      - run: yarn agents:check

      # Fails when libs/*/src/lib/version.ts drifts from that lib's package.json version. Must run
      # before `build`, which regenerates those files as a target dependency and would hide the drift.
      - run: yarn versions:check

      # Changeset notes are capped at one to two sentences / 40 words (see the `changeset` skill).
      # Only unreleased entries are checked - anything listed in .changeset/pre.json is locked.
      - run: yarn lint:changesets

      # Spec files are excluded from every lib's build tsconfig, so this is the only step that
      # type-checks them.
      - run: yarn nx run-many -t typecheck

      - run: yarn nx run-many -t lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: test

      - run: yarn nx run-many -t test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: build

      - run: yarn nx run-many -t build

      # Bundle-size goldens: fails when something in core/query/components becomes unshakeable again.
      # Accept a real change with `nx run treeshake:bundle-goldens:update` and commit goldens.json.
      - run: yarn nx run treeshake:bundle-goldens

      - if: inputs.docs_target != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: dist/apps/docs
          retention-days: 1

  storybook:
    name: Storybook
    if: inputs.run_storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: storybook

      - run: yarn nx run storybook:build-storybook:ci

      - run: yarn playwright install --with-deps chromium

      # Component behavior tests drive the build above; `nx e2e storybook-e2e` would rebuild it.
      - run: yarn playwright test -c apps/storybook-e2e/playwright.config.ts

      - if: inputs.storybook_target != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-dist
          path: dist/storybook
          retention-days: 1

  timetrack-e2e:
    name: Timetrack e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: timetrack-e2e

      - run: yarn playwright install --with-deps chromium

      # Serves the app itself with the e2e host fakes, so unlike the Storybook job there is no
      # prebuilt artifact to drive - the Playwright config starts the server.
      - run: yarn nx e2e timetrack-e2e

  rust:
    name: Rust host
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: rust

      - name: Install the Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/timetrack/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/timetrack/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: yarn nx run timetrack-app:test-rust

  verified:
    name: Verified
    # A single check for a branch rule or a Mergify condition to name. Skipped jobs pass: a run
    # that leaves out Storybook on purpose is still a green run.
    if: always()
    needs: [checks, test, build, storybook, timetrack-e2e, rust]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy:
    name: Deploy
    if: inputs.deploy
    needs: [checks, test, build, storybook, timetrack-e2e, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - if: inputs.storybook_target != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-dist
          path: dist/storybook

      - if: inputs.storybook_target != ''
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
          channelId: ${{ inputs.channel_id }}
          projectId: ethlete-sdk
          target: ${{ inputs.storybook_target }}

      - if: inputs.docs_target != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: dist/apps/docs

      - if: inputs.docs_target != ''
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
          channelId: ${{ inputs.channel_id }}
          projectId: ethlete-sdk
          target: ${{ inputs.docs_target }}
