name: Design compare (slow)

on:
  pull_request:
    paths:
      - 'apps/ethlete-studio/**'
      - '.ethlete/design/**'
  push:
    branches:
      - next
      - main
    paths:
      - 'apps/ethlete-studio/**'
      - '.ethlete/design/**'

concurrency:
  group: design-slow-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: 'true'

jobs:
  slow:
    name: Slow design rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache-key: design-slow

      - run: yarn playwright install --with-deps chromium

      - run: yarn nx run-many -t build -p cli,components

      - run: node dist/libs/cli/src/index.js design check --product studio --slow --base "$NX_BASE"
