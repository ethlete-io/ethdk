name: CI (PR)

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generator PRs are checked by api-models.yml.
  groups:
    if: >-
      ${{ !(github.event.pull_request.user.login == 'nziermann' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, ' from API (')) }}
    uses: ./.github/workflows/ci-groups.yml
    permissions:
      contents: read
    secrets: inherit

  repo:
    if: >-
      ${{ !(github.event.pull_request.user.login == 'nziermann' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.title, ' from API (')) }}
    uses: ./.github/workflows/ci-repo.yml
    permissions:
      contents: read
    secrets: inherit

  ci:
    needs: groups
    if: ${{ !cancelled() && needs.groups.outputs.sdk == 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    with:
      projects: ${{ needs.groups.outputs.sdk_projects }}
      # A fork has no access to the deploy secret.
      deploy: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      storybook_target: storybook-next
    secrets: inherit

  ci-apps:
    needs: groups
    if: ${{ !cancelled() && (needs.groups.outputs.studio == 'true' || needs.groups.outputs.timetrack == 'true') }}
    uses: ./.github/workflows/ci-apps.yml
    permissions:
      contents: read
    with:
      studio_projects: ${{ needs.groups.outputs.studio_projects }}
      timetrack_projects: ${{ needs.groups.outputs.timetrack_projects }}
      base: ${{ needs.groups.outputs.base }}
    secrets: inherit

  verified:
    name: All verified
    # The one check a branch rule can require: the groups ci-groups.yml skipped count as passed.
    if: always()
    needs: [groups, repo, ci, ci-apps]
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
