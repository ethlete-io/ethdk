name: CI (PR)

on:
  pull_request:

concurrency: ci-${{ github.ref }}

# Nx Cloud is temporarily bypassed while the self-hosted instance is unstable. Remote caching
# is off; everything else about the run is unchanged. Delete this to re-enable.
env:
  NX_NO_CLOUD: 'true'

jobs:
  pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          cache: 'yarn'

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - run: yarn install --immutable

      - run: yarn nx format:check

      # Fails when the generated agent files (AGENTS.md marker block, .agents/skills/ethlete-*)
      # drift from libs/agent-rules/content/**.
      - run: yarn nx build agent-rules && node dist/libs/agent-rules/src/index.js check

      # Changeset notes are capped at one to two sentences / 40 words (see the `changeset` skill).
      # Only unreleased entries are checked - anything listed in .changeset/pre.json is locked.
      - run: yarn lint:changesets

      - run: yarn nx run-many -t lint

      - run: yarn nx run-many -t test

      - run: yarn nx run-many -t build

      # Bundle-size goldens: fails when something in core/query/components becomes unshakeable again.
      # Accept a real change with `nx run treeshake:bundle-goldens:update` and commit goldens.json.
      - run: yarn nx run treeshake:bundle-goldens

      - if: "${{ !contains(github.event.pull_request.title, 'from API') && !contains(github.event.pull_request.title, 'API TS Models') }}"
        run: yarn nx run playground:build-storybook:ci

      - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
        if: "${{ github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.title, 'from API') && !contains(github.event.pull_request.title, 'API TS Models') }}"
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
          projectId: ethlete-sdk
          target: storybook-next
