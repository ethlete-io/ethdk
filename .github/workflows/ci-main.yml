name: CI (Main)

on:
  push:
    branches:
      - main

concurrency: release_environment

# Nx Cloud is temporarily bypassed while the self-hosted instance is unstable. Remote caching
# is off; everything else about the run is unchanged. Delete this to re-enable.
env:
  NX_NO_CLOUD: 'true'

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        name: Checkout [main]
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.11.0'
          cache: 'yarn'

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - run: yarn install --immutable

      - run: yarn nx format:check

      - run: yarn nx run-many -t lint

      - run: yarn nx run-many -t test

      - run: yarn nx run-many -t build

      # Bundle-size goldens: fails when something in core/query/components becomes unshakeable again.
      # Accept a real change with `nx run treeshake:bundle-goldens:update` and commit goldens.json.
      - run: yarn nx run treeshake:bundle-goldens

      - run: yarn nx run playground:build-storybook:ci

      # The docs MCP endpoint is built and tested but not deployed yet. Enabling it takes two
      # steps: set the repository variable DEPLOY_DOCS_MCP to 'true' (needs the Blaze plan on the
      # `ethlete-sdk` project — Cloud Functions is unavailable on Spark), and add the /mcp rewrite
      # to the docs hosting targets in firebase.json. Deploy must stay ahead of hosting, or the
      # rewrite resolves to nothing. See apps/docs-mcp/README.md.
      - name: Write Firebase service account
        if: vars.DEPLOY_DOCS_MCP == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy docs MCP function
        if: vars.DEPLOY_DOCS_MCP == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: '${{ runner.temp }}/firebase-service-account.json'
        run: npx --yes firebase-tools@15 deploy --only functions:docs-mcp:docsMcp --project ethlete-sdk --non-interactive --force

      - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
          channelId: live
          projectId: ethlete-sdk
          target: storybook-prod

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETHLETE_SDK }}'
          channelId: live
          projectId: ethlete-sdk
          target: docs-prod

  publish:
    needs: main
    uses: ./.github/workflows/publish.yml
    with:
      version_command: 'yarn changeset:release'
      commit_message: 'chore: 🤖 update versions'
      title: 'Release packages'
      slack_title: '*New Release*'
    secrets: inherit
