name: Publish

on:
  workflow_call:
    inputs:
      version_command:
        required: true
        type: string
      commit_message:
        required: true
        type: string
      title:
        required: true
        type: string
      slack_title:
        required: true
        type: string

# Nx Cloud is temporarily bypassed while the self-hosted instance is unstable. Remote caching
# is off; everything else about the run is unchanged. Delete this to re-enable.
env:
  NX_NO_CLOUD: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      # Shares the cache entry the CI `build` job just wrote, so this restores the same dist
      # instead of building it again.
      - uses: ./.github/actions/setup
        with:
          nx-cache-key: build

      # Also builds tools/changesets-action, which the publish step below runs from dist.
      - run: yarn nx run-many -t build

      # `yarn npm publish` authenticates through npm trusted publishing (OIDC), which Yarn uses
      # only while YARN_NPM_AUTH_TOKEN is unset.
      - name: Publish packages
        id: changesets
        uses: ./tools/changesets-action
        with:
          version-script: ${{ inputs.version_command }}
          commit-message: ${{ inputs.commit_message }}
          publish-script: yarn release
          pr-title: ${{ inputs.title }}
          slack-title: ${{ inputs.slack_title }}
          slack-channel: ${{ secrets.SLACK_CHANNEL_ID }}
        env:
          HUSKY: 0

      - name: Post release notes to slack
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: ${{ steps.changesets.outputs.slack-payload }}

  # The private apps are versioned by changesets but never published, so `changeset publish`
  # makes no release for them. A version without a GitHub release gets a draft here, the bundles
  # below, and is published once every bundle is attached.
  apps-plan:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apps='[]'
          for dir in apps/timetrack apps/ethlete-studio; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            tag="$name@$version"
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            if [ "$draft" = false ]; then
              continue
            fi
            if [ "$draft" = true ]; then
              gh release edit "$tag" --target "$GITHUB_SHA"
            else
              awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' "$dir/CHANGELOG.md" > notes.md
              prerelease=()
              [[ "$version" == *-* ]] && prerelease=(--prerelease)
              gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md "${prerelease[@]}"
            fi
            apps=$(jq -c --arg project "$name" --arg dir "$dir" --arg tag "$tag" --arg version "$version" '. + [{ project: $project, dir: $dir, tag: $tag, version: $version }]' <<< "$apps")
          done
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  apps-bundle:
    needs: apps-plan
    if: needs.apps-plan.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps-plan.outputs.apps) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Bundle ${{ matrix.app.project }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - if: runner.os == 'Linux'
        name: Install the Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.app.dir }}/src-tauri -> target

      # A keychain item's "Always Allow" names the signing certificate. An ad-hoc build has a new
      # identity each release, and Timetrack then asks for the login password once per item.
      # The updater artifacts are enabled here only: a local `tauri build` has no private key to sign them.
      - name: Build the bundles
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Run tools/scripts/tauri-updater-key.sh once."
            exit 1
          fi
          # Tauri's own APPLE_CERTIFICATE import accepts only an Apple-issued certificate name, so the
          # self-signed identity goes into a keychain on the search list, and Tauri signs by its name.
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -z "$MACOS_SIGNING_CERTIFICATE" ]; then
              echo "::error::MACOS_SIGNING_CERTIFICATE is not set. Run tools/scripts/macos-release-identity.sh once."
              exit 1
            fi
            keychain="$RUNNER_TEMP/release-signing.keychain-db"
            keychain_password="$(openssl rand -hex 16)"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            base64 --decode <<< "$MACOS_SIGNING_CERTIFICATE" > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/identity.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s $(security list-keychains -d user | tr -d '"') "$keychain"
            export APPLE_SIGNING_IDENTITY="Ethlete Release Signing"
          fi
          unset MACOS_SIGNING_CERTIFICATE MACOS_SIGNING_CERTIFICATE_PASSWORD
          echo '{ "bundle": { "createUpdaterArtifacts": true } }' > "$RUNNER_TEMP/updater.json"
          yarn nx run ${{ matrix.app.project }}:tauri:build -- --config "$RUNNER_TEMP/updater.json"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}

      # GitHub turns a space in an asset name into a dot, and the manifest must name the asset as
      # GitHub stores it. The updater looks up `<os>-<arch>-<installer>` first, so each bundle type
      # gets its own entry and a deb install never downloads the AppImage.
      - name: Attach the bundles to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=${{ matrix.app.dir }}/src-tauri/target/release/bundle
          for file in "$bundle"/*/*; do
            renamed="$(dirname "$file")/$(basename "$file" | tr ' ' '.')"
            [ "$file" = "$renamed" ] || mv "$file" "$renamed"
          done
          files=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage "$bundle"/dmg/*.dmg "$bundle"/macos/*.app.tar.gz "$bundle"/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundle found in $bundle" >&2
            exit 1
          fi
          gh release upload "${{ matrix.app.tag }}" "${files[@]}" --clobber

          case "$RUNNER_ARCH" in
            X64) arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "Unknown runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$(jq -rn --arg tag "${{ matrix.app.tag }}" '$tag | @uri')"
          platforms='{}'
          for sig in "$bundle"/*/*.sig; do
            file=${sig%.sig}
            case "$file" in
              *.AppImage) key="linux-$arch-appimage" ;;
              *.deb) key="linux-$arch-deb" ;;
              *.rpm) key="linux-$arch-rpm" ;;
              *.app.tar.gz) key="darwin-$arch-app" ;;
              *.exe) key="windows-$arch-nsis" ;;
              *) continue ;;
            esac
            platforms=$(jq -c --arg key "$key" --arg url "$base/$(basename "$file")" --rawfile signature "$sig" \
              '. + { ($key): { url: $url, signature: $signature } }' <<< "$platforms")
          done
          if [ "$platforms" = '{}' ]; then
            echo "No updater signature found in $bundle" >&2
            exit 1
          fi
          echo "$platforms" > "$RUNNER_TEMP/platforms.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-${{ matrix.app.project }}-${{ matrix.os }}
          path: ${{ runner.temp }}/platforms.json
          retention-days: 1

  apps-release:
    needs: [apps-plan, apps-bundle]
    strategy:
      matrix:
        app: ${{ fromJSON(needs.apps-plan.outputs.apps) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: updater-${{ matrix.app.project }}-*
          path: platforms

      - run: gh release edit "${{ matrix.app.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

      # One fixed release per app holds the manifest the installed apps read. GitHub's "latest
      # release" URL cannot serve it: the latest release of this repository is a lib release.
      - name: Point the installed apps at the new version
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_TAG: ${{ matrix.app.project }}-updates
        run: |
          set -euo pipefail
          jq -s --arg version "${{ matrix.app.version }}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{ version: $version, pub_date: $date, platforms: add }' platforms/*/platforms.json > latest.json
          if ! gh release view "$UPDATES_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$UPDATES_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "${{ matrix.app.project }} updates" --notes "The update manifest the installed app reads. Download a bundle from the release of its version."
          fi
          gh release upload "$UPDATES_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
