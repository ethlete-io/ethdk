name: Publish

on:
  workflow_call:
    inputs:
      version_command:
        required: true
        type: string
      commit_message:
        required: true
        type: string
      title:
        required: true
        type: string
      slack_title:
        required: true
        type: string

# Nx Cloud is temporarily bypassed while the self-hosted instance is unstable. Remote caching
# is off; everything else about the run is unchanged. Delete this to re-enable.
env:
  NX_NO_CLOUD: 'true'

jobs:
  publish:
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","ethdk"]') || 'ubuntu-latest' }}
    # node:24.22.1-bookworm
    container: ${{ vars.CI_SELF_HOSTED == 'true' && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && 'node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a' || '' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Shares the cache entry the CI `build` job just wrote, so this restores the same dist
      # instead of building it again.
      - uses: ./.github/actions/setup
        with:
          nx-cache-key: build

      # Also builds tools/changesets-action, which the publish step below runs from dist.
      # The apps are left out: a red app build must not hold back the SDK publish.
      - run: yarn nx run-many -t build --exclude ethlete-studio,timetrack-app,timetrack,timetrack-e2e,timetrack-vscode

      # Switch off: `yarn npm publish` authenticates through npm trusted publishing (OIDC), which
      # Yarn uses only while YARN_NPM_AUTH_TOKEN is unset. Switch on: release-verdaccio.mjs sets
      # it, so no OIDC exchange reaches npmjs.
      - name: Publish packages
        id: changesets
        uses: ./tools/changesets-action
        with:
          version-script: ${{ inputs.version_command }}
          commit-message: ${{ inputs.commit_message }}
          publish-script: ${{ vars.CI_SELF_HOSTED == 'true' && 'node ./tools/scripts/release-verdaccio.mjs' || 'yarn release' }}
          pr-title: ${{ inputs.title }}
          slack-title: ${{ inputs.slack_title }}
          slack-channel: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
        env:
          HUSKY: 0
          VERDACCIO_URL: ${{ vars.CI_SELF_HOSTED == 'true' && vars.VERDACCIO_URL || '' }}
          VERDACCIO_TOKEN: ${{ vars.CI_SELF_HOSTED == 'true' && secrets.VERDACCIO_TOKEN || '' }}
