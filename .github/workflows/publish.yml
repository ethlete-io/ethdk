name: Publish

on:
  workflow_call:
    inputs:
      version_command:
        required: true
        type: string
      commit_message:
        required: true
        type: string
      title:
        required: true
        type: string
      slack_title:
        required: true
        type: string

# Nx Cloud is temporarily bypassed while the self-hosted instance is unstable. Remote caching
# is off; everything else about the run is unchanged. Delete this to re-enable.
env:
  NX_NO_CLOUD: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      # Shares the cache entry the CI `build` job just wrote, so this restores the same dist
      # instead of building it again.
      - uses: ./.github/actions/setup
        with:
          nx-cache-key: build

      # Also builds tools/changesets-action, which the publish step below runs from dist.
      - run: yarn nx run-many -t build

      # `changeset publish` authenticates through YARN_NPM_AUTH_TOKEN, but sync-dist-tags.js
      # calls the npm CLI, which reads only .npmrc.
      - name: Authenticate npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check npm trusted publishing
        continue-on-error: true
        run: |
          id_token=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          node -e 'const c = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url")); console.log({ workflow_ref: c.workflow_ref, job_workflow_ref: c.job_workflow_ref })' "$id_token"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $id_token" https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@ethlete%2ftypes)
          echo "OIDC exchange for @ethlete/types: HTTP $status"
          [[ $status == 2* ]]

      - name: Publish packages
        id: changesets
        uses: ./tools/changesets-action
        with:
          version-script: ${{ inputs.version_command }}
          commit-message: ${{ inputs.commit_message }}
          publish-script: yarn release
          pr-title: ${{ inputs.title }}
          slack-title: ${{ inputs.slack_title }}
          slack-channel: ${{ secrets.SLACK_CHANNEL_ID }}
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0

      - name: Post release notes to slack
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: ${{ steps.changesets.outputs.slack-payload }}
